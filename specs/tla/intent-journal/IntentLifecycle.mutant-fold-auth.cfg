\* expect: Invariant FoldRetiresOnlyUnapplied is violated
\* Mutant: the fold also takes an authorization refusal, whose exit is resume. Caught only with
\* RoleDiscipline = FALSE, that is, pushes outside the push role: under the push role an
\* authorization refusal pauses the bundle, so an auth fold cannot occur and the pass configs do
\* not catch this mutant.
SPECIFICATION Spec
CONSTANTS
  None = None
  Pushers = {p1, p2}
  MaxRid = 3
  MaxCommits = 2
  MaxCrash = 0
  MaxLoss = 0
  MaxConflict = 0
  MaxRefuse = 0
  MaxAuthRefuse = 1
  ReclaimBeforePush = FALSE
  AdmitRefused = FALSE
  RoleDiscipline = FALSE
  FoldRefusedCodes = {"content", "auth"}
  FoldDropsEdit = FALSE
INVARIANT FoldRetiresOnlyUnapplied
