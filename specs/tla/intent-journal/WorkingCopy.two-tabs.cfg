\* expect: pass
\* Two tabs, each its own runtime so unserialized, with pull consistency, acknowledgement invalidation and the pull fence, as on main.
SPECIFICATION Spec
SYMMETRY ThreadSymmetry
CONSTANTS
  x = x  y = y  v0 = v0  v1 = v1  v2 = v2  t1 = t1  t2 = t2
  Absent = Absent  NoBase = NoBase  None = None
  Threads = {t1, t2}
  Docs = {x, y}
  Vals = {v0, v1}
  InitDoc <- MCInit
  MaxTP = 1
  MaxCommits = 1
  Serialize = FALSE
  PullConsistency = TRUE
  AckInvalidates = TRUE
  PullFence = TRUE
  FenceIgnoresMarker = FALSE
INVARIANTS TypeOK TruthfulDigest
PROPERTIES NoRegress OwnedWrites DigestByOwner
