  NWorkers = 2
  MaxRuns = 1
  MaxRetries = 1
  Modes = {"plain", "wait", "ifAvail"}
  OwnerRecheck = TRUE
  DiagnosisRecheck = TRUE
  NsFault = FALSE
  PidReuse = FALSE
  HostChange = TRUE
  AllowCrash = TRUE
INVARIANTS RetryDiagAccurate
