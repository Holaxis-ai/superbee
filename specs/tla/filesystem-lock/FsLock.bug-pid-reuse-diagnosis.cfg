\* expect: Invariant RetryDiagAccurate is violated
\* Open: a dead owner's reused pid keeps plain and waiting callers on a "retry" diagnosis.
SPECIFICATION Spec
CONSTANTS
  NWorkers = 2
  MaxRuns = 1
  MaxRetries = 1
  Modes = {"plain", "wait"}
  OwnerRecheck = TRUE
  DiagnosisRecheck = TRUE
  NsFault = FALSE
  PidReuse = TRUE
  HostChange = FALSE
  AllowCrash = TRUE
INVARIANTS RetryDiagAccurate
