<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src 'none'; connect-src 'none'; frame-src blob:; child-src blob:; worker-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
        background: var(--color-background-primary, transparent);
        color: var(--color-text-primary, CanvasText);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 0; }
      .shell {
        display: grid;
        gap: 0.65rem;
        padding: max(0.75rem, env(safe-area-inset-top))
          max(0.75rem, env(safe-area-inset-right))
          max(0.75rem, env(safe-area-inset-bottom))
          max(0.75rem, env(safe-area-inset-left));
      }
      .status-row {
        display: flex;
        gap: 0.65rem;
        align-items: center;
        justify-content: space-between;
      }
      .status {
        color: var(--color-text-secondary, GrayText);
        font-size: 0.82rem;
        line-height: 1.35;
      }
      .status[data-kind="error"] { color: var(--color-text-danger, #b42318); }
      .confirmation-backdrop[hidden] { display: none; }
      body[data-dialog-open] .shell { display: none; }
      .actions-label {
        color: var(--color-text-secondary, GrayText);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-right: 0.15rem;
      }
      button {
        appearance: none;
        border: 1px solid var(--color-border-primary, color-mix(in srgb, CanvasText 30%, transparent));
        border-radius: 0.55rem;
        background: var(--color-background-primary, Canvas);
        color: var(--color-text-primary, CanvasText);
        cursor: pointer;
        font: inherit;
        font-size: 0.84rem;
        font-weight: 650;
        padding: 0.48rem 0.72rem;
      }
      button:hover:not(:disabled) { border-color: var(--color-border-info, #3984d8); }
      button:disabled { cursor: default; opacity: 0.55; }
      iframe {
        display: block;
        width: 100%;
        height: 18rem;
        min-height: 0;
        border: 0;
        border-radius: 0.75rem;
        background: transparent;
      }
      html[data-fixed-height], html[data-fixed-height] body {
        height: 100%;
        overflow: hidden;
      }
      html[data-fixed-height] .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      html[data-fixed-height] iframe {
        flex: 1 1 auto;
        height: auto;
      }
      html[data-fixed-height] body[data-dialog-open] {
        overflow: auto;
      }
      html[data-fixed-height] .confirmation-backdrop {
        min-height: 100%;
      }
      .confirmation-backdrop {
        display: grid;
        place-items: center;
        padding: 1rem;
        background: color-mix(in srgb, #000 55%, transparent);
      }
      .confirmation {
        width: min(34rem, 100%);
        border: 1px solid var(--color-border-primary, color-mix(in srgb, CanvasText 24%, transparent));
        border-radius: 0.9rem;
        background: var(--color-background-primary, Canvas);
        color: var(--color-text-primary, CanvasText);
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 0.32);
        padding: 1rem;
      }
      .confirmation h2 { margin: 0.15rem 0 0.6rem; font-size: 1.2rem; }
      .confirmation p { margin: 0 0 0.8rem; color: var(--color-text-secondary, GrayText); }
      .confirmation dl { margin: 0; }
      .confirmation dl div {
        display: grid;
        grid-template-columns: minmax(5rem, 0.35fr) minmax(0, 1fr);
        gap: 0.7rem;
        padding: 0.48rem 0;
        border-top: 1px solid var(--color-border-secondary, color-mix(in srgb, CanvasText 14%, transparent));
      }
      .confirmation dt { color: var(--color-text-secondary, GrayText); }
      .confirmation dd { margin: 0; overflow-wrap: anywhere; }
      .confirmation-buttons { display: flex; justify-content: flex-end; gap: 0.55rem; margin-top: 1rem; }
      .confirmation-apply {
        border-color: var(--color-border-success, #168653);
        background: var(--color-background-success, #16613f);
        color: var(--color-text-inverse, #fff);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="status-row">
        <div id="status" class="status">Waiting for a Superbee View…</div>
        <button id="display-mode" type="button" hidden>Expand</button>
      </div>
      <iframe
        id="active-view"
        title="Superbee View"
        sandbox
        referrerpolicy="no-referrer"
      ></iframe>
    </main>
    <div id="authorization-backdrop" class="confirmation-backdrop" role="presentation" hidden>
      <section
        class="confirmation"
        role="dialog"
        aria-modal="true"
        aria-labelledby="authorization-title"
      >
        <div class="actions-label">Local View approval</div>
        <h2 id="authorization-title">Trust this View with bundle data?</h2>
        <p id="authorization-description"></p>
        <dl>
          <div><dt>View</dt><dd id="authorization-view"></dd></div>
          <div><dt>HTML</dt><dd id="authorization-version"></dd></div>
          <div><dt>Access</dt><dd><code id="authorization-access"></code></dd></div>
        </dl>
        <div class="confirmation-buttons">
          <button id="authorization-cancel" type="button">Cancel</button>
          <button id="authorization-apply" class="confirmation-apply" type="button" disabled>
            Trust and run this View
          </button>
        </div>
      </section>
    </div>
    <div id="confirmation-backdrop" class="confirmation-backdrop" role="presentation" hidden>
      <section
        class="confirmation"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirmation-title"
      >
        <div class="actions-label">Superbee confirmation</div>
        <h2 id="confirmation-title">Apply this bundle change?</h2>
        <p>The View cannot write directly. The trusted shell will commit only this exact, version-guarded change.</p>
        <dl>
          <div><dt>Document</dt><dd id="confirmation-document"></dd></div>
          <div><dt>Kind</dt><dd id="confirmation-kind"></dd></div>
          <div><dt>Field</dt><dd id="confirmation-field"></dd></div>
          <div><dt>Before</dt><dd id="confirmation-before"></dd></div>
          <div><dt>After</dt><dd id="confirmation-after"></dd></div>
          <div><dt>Actor</dt><dd id="confirmation-actor"></dd></div>
        </dl>
        <div class="confirmation-buttons">
          <button id="confirmation-cancel" type="button">Cancel</button>
          <button id="confirmation-apply" class="confirmation-apply" type="button">Apply change</button>
        </div>
      </section>
    </div>
    <!-- ASLITE_MCP_APP_SCRIPT -->
  </body>
</html>
