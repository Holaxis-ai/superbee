name: Release runtime libraries (build once, publish separately)

# `libraries/v<version>` is independent of the public CLI's `v<version>` release identity. The
# credential-free job builds and packs both libraries once. Later jobs only move those exact bytes:
# core, then server, each published through OIDC trusted publishing with npm provenance, then the
# finalizer is dispatched automatically. The pair also retains GitHub build attestations, which
# remain the registry finalizer's proof, verified against the dedicated source tag.
# TRANSITIONAL: a failed publish falls back to `npm stage publish` and human `npm stage approve`
# until every trusted publisher allows `npm publish`.
on:
  push:
    tags: ["libraries/v*"]

permissions: {}

concurrency:
  group: runtime-libraries-release
  cancel-in-progress: false

jobs:
  build:
    name: build and prove both libraries once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      bootstrap: ${{ steps.meta.outputs.bootstrap }}
      core_tgz: ${{ steps.pack.outputs.core_tgz }}
      server_tgz: ${{ steps.pack.outputs.server_tgz }}
      core_sha256: ${{ steps.pack.outputs.core_sha256 }}
      server_sha256: ${{ steps.pack.outputs.server_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Check Node runtime policy before installation
        run: node scripts/node-runtime-policy.mjs
      - run: npm ci --ignore-scripts
      - name: Resolve the synchronized version from the libraries tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" \
            || { echo "::error::cannot resolve current main"; exit 1; }
          test "$GITHUB_SHA" = "$MAIN_SHA" \
            || { echo "::error::library releases must be tagged from current main ($MAIN_SHA), not older commit $GITHUB_SHA"; exit 1; }
          git fetch --force --no-tags origin '+refs/tags/libraries/v*:refs/tags/libraries/v*' \
            || { echo "::error::cannot fetch the protected library release tag history"; exit 1; }
          CORE_V="$(node -p 'require("./packages/core/package.json").version')"
          SERVER_V="$(node -p 'require("./packages/server/package.json").version')"
          test "$CORE_V" = "$SERVER_V" || { echo "::error::core $CORE_V and server $SERVER_V are not synchronized"; exit 1; }
          V="$CORE_V"
          test "libraries/v$V" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match library version $V"; exit 1; }
          T="$(node --input-type=module -e '
            import { parseStrictSemver } from "./scripts/strict-semver.mjs";
            const parsed = parseStrictSemver(process.argv[1]);
            if (!parsed) { console.error(`::error::invalid library version ${process.argv[1]}`); process.exit(1); }
            process.stdout.write(parsed.prerelease === null ? "latest" : "next");
          ' -- "$V")"
          MERGED_TAGS="$(git tag --merged "$GITHUB_SHA" --list 'libraries/v*')" \
            || { echo "::error::cannot resolve prior reachable library release tags"; exit 1; }
          PRIOR_TAGS=()
          while IFS= read -r PRIOR_TAG; do
            [ -z "$PRIOR_TAG" ] || PRIOR_TAGS+=("$PRIOR_TAG")
          done <<< "$MERGED_TAGS"
          node --input-type=module -e '
            import { compareStrictSemver, parseStrictSemver } from "./scripts/strict-semver.mjs";
            const [current, ...tags] = process.argv.slice(1);
            const parsedCurrent = parseStrictSemver(current);
            const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
            if (!parsedCurrent) fail(`invalid library version ${current}`);
            const channel = (parsed) => parsed.prerelease === null ? "latest" : "next";
            for (const tag of tags) {
              if (tag === `libraries/v${current}`) continue;
              const prior = tag.slice("libraries/v".length);
              const parsedPrior = parseStrictSemver(prior);
              if (!parsedPrior) fail(`protected release tag ${tag} has an invalid version`);
              if (channel(parsedPrior) !== channel(parsedCurrent)) continue;
              const comparison = compareStrictSemver(current, prior);
              if (comparison === undefined || comparison <= 0) {
                fail(`${current} would not advance ${channel(parsedCurrent)} beyond reachable ${tag}`);
              }
            }
          ' -- "$V" "${PRIOR_TAGS[@]}"
          if [ "$V" = "0.1.0" ]; then BOOTSTRAP=true; else BOOTSTRAP=false; fi
          {
            echo "version=$V"
            echo "dist_tag=$T"
            echo "bootstrap=$BOOTSTRAP"
          } >> "$GITHUB_OUTPUT"
      - name: Require the CI verdict already recorded on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: main
        run: |
          set -euo pipefail
          # Release-source validation consumes the newest CI verdict already recorded on this exact
          # commit — ordinarily the push-to-main run; a rerun or manual dispatch of the same
          # workflow counts equally — and never reruns CI. The newest repository-workflow check run
          # named after the canonical required context decides. A pending or not-yet-visible verdict
          # is polled briefly (a full CI run takes ~6 minutes); a failed, missing, or unqueryable
          # verdict refuses fail-closed: never publish bytes whose source CI cannot vouch for.
          for attempt in $(seq 1 16); do
            VERDICT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20required%20lanes&filter=latest&per_page=100" \
              --jq '([.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last) as $r
                | if $r == null then "missing"
                  elif $r.status != "completed" then "pending"
                  elif $r.conclusion == "success" then "success"
                  else "concluded:" + ($r.conclusion // "unknown") end')" \
              || { echo "::error::cannot query check runs for $GITHUB_SHA; refusing to build without the CI verdict"; exit 1; }
            case "$VERDICT" in
              success) break ;;
              missing|pending) echo "CI required lanes not settled on $GITHUB_SHA yet (attempt $attempt: $VERDICT)"; if [ "$attempt" -lt 16 ]; then sleep 30; fi ;;
              *) echo "::error::CI required lanes on $GITHUB_SHA is '$VERDICT'; fix CI on $SOURCE_REF before tagging"; exit 1 ;;
            esac
          done
          test "$VERDICT" = "success" || { echo "::error::no successful 'CI required lanes' verdict appeared on $GITHUB_SHA (last state: $VERDICT); wait for or dispatch CI on $SOURCE_REF, then re-push the tag"; exit 1; }
      - name: Build both runtime libraries
        run: npm run build -w @superbee/core -w @superbee/server
      - name: Pack once and prove the literal pair
        id: pack
        run: |
          set -euo pipefail
          mkdir -p out
          npm pack -w @superbee/core --json --pack-destination out > core-pack.json
          npm pack -w @superbee/server --json --pack-destination out > server-pack.json
          CORE_PACKED="$(node -p 'require("./core-pack.json")[0].filename')"
          SERVER_PACKED="$(node -p 'require("./server-pack.json")[0].filename')"
          test "$(node -p 'require("./core-pack.json").length')" = "1"
          test "$(node -p 'require("./server-pack.json").length')" = "1"
          mv -- "out/$CORE_PACKED" out/superbee-core.tgz
          mv -- "out/$SERVER_PACKED" out/superbee-server.tgz
          CORE_TGZ=superbee-core.tgz
          SERVER_TGZ=superbee-server.tgz
          npm run verify:runtime-libraries
          {
            echo "core_tgz=$CORE_TGZ"
            echo "server_tgz=$SERVER_TGZ"
            echo "core_sha256=$(sha256sum "out/$CORE_TGZ" | cut -d' ' -f1)"
            echo "server_sha256=$(sha256sum "out/$SERVER_TGZ" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-libraries-${{ steps.meta.outputs.version }}
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 90

  attest:
    name: attest the exact library pair
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-libraries-${{ needs.build.outputs.version }}
          path: out
      - name: Re-hash both retained artifacts
        run: |
          set -euo pipefail
          test "$(sha256sum "out/${{ needs.build.outputs.core_tgz }}" | cut -d' ' -f1)" = "${{ needs.build.outputs.core_sha256 }}"
          test "$(sha256sum "out/${{ needs.build.outputs.server_tgz }}" | cut -d' ' -f1)" = "${{ needs.build.outputs.server_sha256 }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ needs.build.outputs.core_tgz }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ needs.build.outputs.server_tgz }}
      - name: Print the one-time bootstrap gate
        if: needs.build.outputs.bootstrap == 'true'
        env:
          V: ${{ needs.build.outputs.version }}
          CORE_TGZ: ${{ needs.build.outputs.core_tgz }}
          SERVER_TGZ: ${{ needs.build.outputs.server_tgz }}
          CORE_SHA: ${{ needs.build.outputs.core_sha256 }}
          SERVER_SHA: ${{ needs.build.outputs.server_sha256 }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          {
            echo "## Human bootstrap required for the first public library release"
            echo ""
            echo "npm trusted publishing cannot create a new package. Download this run's retained artifact, verify the two digests, then a human maintainer may publish core followed by server with interactive 2FA:"
            echo ""
            echo "- $CORE_TGZ: \`$CORE_SHA\`"
            echo "- $SERVER_TGZ: \`$SERVER_SHA\`"
            echo ""
            echo '```sh'
            echo "npm publish \"./$CORE_TGZ\" --access public --tag \"$DIST_TAG\" --ignore-scripts"
            echo "npm publish \"./$SERVER_TGZ\" --access public --tag \"$DIST_TAG\" --ignore-scripts"
            echo "gh workflow run release-libraries-finalize.yml -f version=$V"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish_core:
    name: publish core on npm (OIDC)
    if: needs.build.outputs.bootstrap != 'true'
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read
    outputs:
      mode: ${{ steps.publish.outputs.mode }}
      stage_id: ${{ steps.publish.outputs.stage_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-libraries-${{ needs.build.outputs.version }}
          path: out
      - name: Re-hash the core bytes about to be published
        run: |
          test "$(sha256sum "out/${{ needs.build.outputs.core_tgz }}" | cut -d' ' -f1)" = "${{ needs.build.outputs.core_sha256 }}"
      # registry-url is load-bearing: npm writes the exchanged OIDC token into the user config layer
      # this creates (npm oidc.js). Removing it produced ENEEDAUTH in run 31975597582.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
      - name: Publish the exact core tarball
        id: publish
        env:
          PKG: "@superbee/core"
          V: ${{ needs.build.outputs.version }}
          TGZ: ${{ needs.build.outputs.core_tgz }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # The leading ./ is load-bearing: npm parses a bare dir/file.tgz as github:owner/repo
          # shorthand (run 31499362043). --loglevel verbose is where npm reports a failed OIDC
          # exchange (run 31972609262).
          LOCAL="sha512-$(node -e 'process.stdout.write(require("crypto").createHash("sha512").update(require("fs").readFileSync(process.argv[1])).digest("base64"))' "./out/$TGZ")"
          # Re-run safety: a version npm already serves must be exactly these bytes; never publish twice.
          # Read anonymously: the registry-url user config carries setup-node's placeholder token.
          SERVED="$(NPM_CONFIG_USERCONFIG=/dev/null npm view "$PKG@$V" dist.integrity 2>/dev/null || true)"
          if [ -n "$SERVED" ]; then
            test "$SERVED" = "$LOCAL" || { echo "::error::npm already serves $PKG@$V as $SERVED, not this run's tarball ($LOCAL)"; exit 1; }
            echo "$PKG@$V is already published with these exact bytes; nothing to publish"
            echo "mode=published" >> "$GITHUB_OUTPUT"
          elif npm publish "./out/$TGZ" --tag "$DIST_TAG" --access public --provenance --ignore-scripts --loglevel verbose 2>&1 | tee publish.log; then
            echo "mode=published" >> "$GITHUB_OUTPUT"
          else
            # TRANSITIONAL: remove once every trusted publisher allows npm publish. Until then OIDC
            # `npm publish` fails auth while `npm stage publish` is still allowed.
            CODE="$(grep -oE '\bE[0-9]{3}\b|ENEEDAUTH|EOTP' publish.log 2>/dev/null | head -n 1 || true)"
            echo "::warning::$PKG not published directly (${CODE:-no npm error code}); falling back to npm stage publish for human approval"
            echo "- $PKG: not published directly (${CODE:-no npm error code}); staged for human approval instead" >> "$GITHUB_STEP_SUMMARY"
            npm stage publish "./out/$TGZ" --tag "$DIST_TAG" --access public --provenance=false --json --loglevel verbose > stage.json
            STAGE_ID="$(node -e '
              const value = JSON.parse(require("fs").readFileSync("stage.json", "utf8"));
              const find = (v) => v && typeof v === "object" ? (typeof v.stageId === "string" ? v.stageId : Object.values(v).map(find).find(Boolean)) : undefined;
              const id = find(value); if (!id) process.exit(1); process.stdout.write(id);
            ')"
            { echo "mode=staged"; echo "stage_id=$STAGE_ID"; } >> "$GITHUB_OUTPUT"
          fi

  publish_server:
    name: publish server on npm (OIDC)
    if: ${{ always() && needs.build.outputs.bootstrap != 'true' && needs.attest.result == 'success' && needs.publish_core.result == 'success' }}
    needs: [build, attest, publish_core]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read
    outputs:
      mode: ${{ steps.publish.outputs.mode }}
      stage_id: ${{ steps.publish.outputs.stage_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-libraries-${{ needs.build.outputs.version }}
          path: out
      - name: Re-hash the server bytes about to be published
        run: |
          test "$(sha256sum "out/${{ needs.build.outputs.server_tgz }}" | cut -d' ' -f1)" = "${{ needs.build.outputs.server_sha256 }}"
      # registry-url is load-bearing: npm writes the exchanged OIDC token into the user config layer
      # this creates (npm oidc.js). Removing it produced ENEEDAUTH in run 31975597582.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
      - name: Publish the exact server tarball
        id: publish
        env:
          PKG: "@superbee/server"
          V: ${{ needs.build.outputs.version }}
          TGZ: ${{ needs.build.outputs.server_tgz }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          CORE_MODE: ${{ needs.publish_core.outputs.mode }}
        run: |
          set -euo pipefail
          # The leading ./ is load-bearing: npm parses a bare dir/file.tgz as github:owner/repo
          # shorthand (run 31499362043). --loglevel verbose is where npm reports a failed OIDC
          # exchange (run 31972609262).
          LOCAL="sha512-$(node -e 'process.stdout.write(require("crypto").createHash("sha512").update(require("fs").readFileSync(process.argv[1])).digest("base64"))' "./out/$TGZ")"
          # Re-run safety: a version npm already serves must be exactly these bytes; never publish twice.
          # Read anonymously: the registry-url user config carries setup-node's placeholder token.
          SERVED="$(NPM_CONFIG_USERCONFIG=/dev/null npm view "$PKG@$V" dist.integrity 2>/dev/null || true)"
          # server pins core exactly: while core is only staged, server is staged too (never public first).
          if [ -n "$SERVED" ]; then
            test "$SERVED" = "$LOCAL" || { echo "::error::npm already serves $PKG@$V as $SERVED, not this run's tarball ($LOCAL)"; exit 1; }
            echo "$PKG@$V is already published with these exact bytes; nothing to publish"
            echo "mode=published" >> "$GITHUB_OUTPUT"
          elif [ "$CORE_MODE" = published ] && npm publish "./out/$TGZ" --tag "$DIST_TAG" --access public --provenance --ignore-scripts --loglevel verbose 2>&1 | tee publish.log; then
            echo "mode=published" >> "$GITHUB_OUTPUT"
          else
            # TRANSITIONAL: remove once every trusted publisher allows npm publish. Until then OIDC
            # `npm publish` fails auth while `npm stage publish` is still allowed.
            CODE="$(grep -oE '\bE[0-9]{3}\b|ENEEDAUTH|EOTP' publish.log 2>/dev/null | head -n 1 || true)"
            [ "$CORE_MODE" = published ] || CODE="core is only staged"
            echo "::warning::$PKG not published directly (${CODE:-no npm error code}); falling back to npm stage publish for human approval"
            echo "- $PKG: not published directly (${CODE:-no npm error code}); staged for human approval instead" >> "$GITHUB_STEP_SUMMARY"
            npm stage publish "./out/$TGZ" --tag "$DIST_TAG" --access public --provenance=false --json --loglevel verbose > stage.json
            STAGE_ID="$(node -e '
              const value = JSON.parse(require("fs").readFileSync("stage.json", "utf8"));
              const find = (v) => v && typeof v === "object" ? (typeof v.stageId === "string" ? v.stageId : Object.values(v).map(find).find(Boolean)) : undefined;
              const id = find(value); if (!id) process.exit(1); process.stdout.write(id);
            ')"
            { echo "mode=staged"; echo "stage_id=$STAGE_ID"; } >> "$GITHUB_OUTPUT"
          fi
      # TRANSITIONAL: remove once every trusted publisher allows npm publish.
      - name: Print the human npm gates
        if: needs.publish_core.outputs.mode == 'staged' || steps.publish.outputs.mode == 'staged'
        env:
          V: ${{ needs.build.outputs.version }}
          CORE_MODE: ${{ needs.publish_core.outputs.mode }}
          SERVER_MODE: ${{ steps.publish.outputs.mode }}
          CORE_STAGE: ${{ needs.publish_core.outputs.stage_id }}
          SERVER_STAGE: ${{ steps.publish.outputs.stage_id }}
        run: |
          {
            echo "## @superbee/core and @superbee/server need human npm approval (transitional fallback)"
            echo ""
            echo "Inspect and approve core first, then server. Each approval requires the human's npm 2FA."
            echo ""
            echo '```sh'
            if [ "$CORE_MODE" = staged ]; then echo "npm stage approve $CORE_STAGE"; fi
            if [ "$SERVER_MODE" = staged ]; then echo "npm stage approve $SERVER_STAGE"; fi
            echo "gh workflow run release-libraries-finalize.yml -f version=$V"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    # Only when both packages were published directly; any staged fallback waits for human approval.
    # The finalizer queues behind this run in the shared concurrency group and stays read-only.
    # A queued finalizer can be cancelled if another tag of the same family is pushed meanwhile
    # (only one pending run per group); then re-dispatch it by hand with the printed version.
    name: dispatch the runtime libraries finalizer
    needs: [build, publish_core, publish_server]
    if: needs.publish_core.outputs.mode == 'published' && needs.publish_server.outputs.mode == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch release-libraries-finalize.yml for this version
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release-libraries-finalize.yml -R "$GITHUB_REPOSITORY" --ref main -f version="$V"
          echo "Dispatched release-libraries-finalize.yml for @superbee/core and @superbee/server $V" >> "$GITHUB_STEP_SUMMARY"
