name: Release finalize (GitHub release after npm publication)

# Dispatched automatically by release.yml once it publishes directly, or by a maintainer after a
# human approves the transitional staged fallback. Holds no npm credential and performs no npm
# write: it proves the registry already serves the version on its dist-tag, downloads the exact
# published bytes back from npm, checks them against the build attestation from release.yml,
# and creates the GitHub release published in one step (no draft). Re-running is safe: an existing
# published release is left alone.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version already published on npm, e.g. 0.1.3 or 0.1.3-pre.1"
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  finalize:
    name: verify registry and create the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Prove npm serves this version on its dist-tag
        id: registry
        env:
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$V" in v*) echo "::error::pass the bare version, not the tag"; exit 1 ;; esac
          case "$V" in *-*) T=next ;; *) T=latest ;; esac
          # Registry reads lag writes by seconds (commit d6e4f6f), and an automatic dispatch arrives
          # right after publish; retry for up to two minutes, then fail with the command still owed.
          # Unreachable and mismatch both stop here; nothing has been mutated.
          for attempt in $(seq 1 12); do
            SEEN="$(npm view "superbee@$V" version 2>/dev/null || true)"
            TAGGED="$(npm view superbee "dist-tags.$T" 2>/dev/null || true)"
            [ "$SEEN" = "$V" ] && [ "$TAGGED" = "$V" ] && break
            echo "registry not settled yet (attempt $attempt): version=$SEEN $T=$TAGGED"; sleep 10
          done
          test "$SEEN" = "$V" || { echo "::error::npm does not serve superbee@$V. If release.yml fell back to staging, a human must approve that stage first"; exit 1; }
          test "$TAGGED" = "$V" || { echo "::error::the npm $T tag points at $TAGGED, expected $V"; exit 1; }
          echo "dist_tag=$T" >> "$GITHUB_OUTPUT"
      - name: Download the exact published bytes from npm and verify the build attestation
        env:
          V: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          npm pack "superbee@$V" --ignore-scripts --pack-destination out >/dev/null
          test -f "out/superbee-$V.tgz"
          # The attestation was made by release.yml's publish job on the tarball it handed to npm; a
          # match proves npm published exactly those bytes.
          gh attestation verify "out/superbee-$V.tgz" -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/v$V" \
            || { echo "::error::no build attestation from release.yml at refs/tags/v$V matches the bytes npm serves for superbee@$V (was this version published by release.yml?)"; exit 1; }
      - name: Prove the installed README and npm platform metadata
        env:
          V: ${{ inputs.version }}
          T: ${{ steps.registry.outputs.dist_tag }}
        run: |
          set -euo pipefail
          npm view "superbee@$V" version readmeFilename engines os --json > out/registry-package.json
          npm view superbee dist-tags --json > out/registry-tags.json
          tar -xOf "out/superbee-$V.tgz" package/package.json > out/tarball-package.json
          tar -xOf "out/superbee-$V.tgz" package/README.md > out/tarball-readme.md
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const version = process.env.V;
          const tag = process.env.T;
          const [registry, tags, manifest, readme] = await Promise.all([
            readFile("out/registry-package.json", "utf8").then(JSON.parse),
            readFile("out/registry-tags.json", "utf8").then(JSON.parse),
            readFile("out/tarball-package.json", "utf8").then(JSON.parse),
            readFile("out/tarball-readme.md", "utf8"),
          ]);
          assert.equal(registry.version, version, "registry metadata version differs from the published version");
          assert.equal(tags[tag], version, `registry ${tag} tag differs from the published version`);
          // Direct publish records README.md; the transitional staged fallback may omit README
          // metadata. Both are accepted; the attested tarball below owns the README bytes and name.
          assert.ok(registry.readmeFilename === "" || registry.readmeFilename === "README.md", "registry metadata names an unexpected README file");
          // The registry document's `readme` field is never compared: staged publishing leaves it
          // empty, and after a direct publish it is document-level, not per version. The exact
          // public tarball was verified against release.yml's build attestation in the prior step,
          // so its installed README and embedded manifest are the supported byte authorities.
          assert.equal(manifest.readme, readme, "packed manifest does not carry the installed README.md bytes");
          assert.equal(manifest.readmeFilename, "README.md", "packed manifest does not name README.md");
          assert.deepEqual(registry.engines, manifest.engines, "registry Node requirements differ from the installed manifest");
          assert.deepEqual(registry.os, manifest.os, "registry platform metadata differs from the installed manifest");
          assert.deepEqual(manifest.os, ["darwin", "linux"], "the executable must declare its supported hosts");
          assert.match(readme, /^## Install$/m);
          assert.match(readme, /supported Node\.js 22, 24, or 26 release \(22\.14\.0 minimum\) on macOS or Linux/);
          assert.match(readme, /installed by your agent,\s+not by hand/);
          assert.match(readme, /Run `superbee setup` and follow its instructions/);
          assert.match(readme, /`latest`[\s\S]+`next`|`next`[\s\S]+`latest`/);
          if (version.includes("-")) {
            assert.match(readme, /^[ \t]*npm install -g superbee@next[ \t]*$/m);
          } else {
            assert.match(readme, /^[ \t]*npm install -g superbee[ \t]*$/m);
            assert.doesNotMatch(readme, /npm install -g superbee@next/);
          }
          NODE
      # Only the tag-selection script is needed; nothing from the checkout is built or installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
          path: source
      - name: Choose where the generated release notes start
        id: notes
        env:
          V: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          START="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' \
            | node source/scripts/release-notes-start-tag.mjs "$V")"
          [ -n "$START" ] || echo "::warning::no earlier release tag below v$V; GitHub chooses the notes start"
          echo "start=$START" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release (published, once) with the npm tarball attached
        env:
          V: ${{ inputs.version }}
          T: ${{ steps.registry.outputs.dist_tag }}
          START: ${{ steps.notes.outputs.start }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$V"
          if [ "$T" = "latest" ]; then FLAG="--latest"; else FLAG="--prerelease"; fi
          # Look before creating: a prior run may have already published, and a legacy draft may
          # exist for this tag. Drafts are addressed here by tag through gh, which resolves them.
          STATE="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "absent")"
          case "$STATE" in
            false) echo "release $TAG is already published; verifying its asset below" ;;
            true)
              gh release upload "$TAG" "out/superbee-$V.tgz" -R "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false "$FLAG" ;;
            *)
              gh release create "$TAG" "out/superbee-$V.tgz" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes ${START:+--notes-start-tag "$START"} "$FLAG" ;;
          esac
          # Every path ends here: the published release must carry exactly the bytes npm serves.
          mkdir -p check
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "superbee-$V.tgz" -D check --clobber \
            || { echo "::error::release $TAG has no asset superbee-$V.tgz; upload it or recreate the release"; exit 1; }
          test "$(shasum -a 256 "check/superbee-$V.tgz" | cut -d' ' -f1)" = "$(shasum -a 256 "out/superbee-$V.tgz" | cut -d' ' -f1)" \
            || { echo "::error::asset superbee-$V.tgz on release $TAG differs from the bytes npm serves for superbee@$V"; exit 1; }
          URL="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq .url)"
          if gh release verify "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then IMMUTABLE="immutable (verified)"; else IMMUTABLE="not immutable - enable Immutable releases in repository settings"; fi
          {
            echo "## superbee@$V released"
            echo ""
            echo "- npm: https://www.npmjs.com/package/superbee/v/$V (dist-tag \`$T\`)"
            echo "- GitHub: $URL ($IMMUTABLE)"
            echo "- tarball sha256: \`$(shasum -a 256 "out/superbee-$V.tgz" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke the published package as a user would
        env:
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          OBSERVED="$(npx --yes "superbee@$V" --version)"
          test "$OBSERVED" = "$V" || { echo "::error::npx superbee@$V --version printed '$OBSERVED'"; exit 1; }
