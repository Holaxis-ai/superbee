name: Finalize release (separately dispatched)

# P5A finalizer — separately dispatched after interactive npm stage inspection and approval. Every
# job independently downloads the original candidate and stage-receipt artifacts by immutable ID,
# queries their Actions API metadata, and compares the candidate bytes, source SHA, stage ID, draft
# ID, and exact GitHub asset IDs/digests before doing anything live. The ordering-verified job (and
# a pre-publish re-check) additionally verifies SIGNED operator inspection/approval receipts
# (draft-release assets, ssh-signed against .github/release-allowed-signers) by replaying the
# release-state machine: stable candidates require both receipts; a prerelease missing receipts
# publishes with a permanent public receipt-status stamp; invalid evidence is always fatal. The
# write-capable job then deletes only planned asset IDs, replaces status/body evidence, re-queries
# the draft, and proves the exact retained id/name/digest inventory before publication.
#
# P5S must protect the `release` environment and set ASLITE_RELEASE_LIVE_ENABLED=true there. GitHub
# auto-creates missing environments without protection, so absence of that explicit variable always
# fails closed even if someone dispatches with mode=live.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Original staged workflow run id"
        required: true
      artifact_id:
        description: "Candidate artifact id from the staged run"
        required: true
      stage_receipt_artifact_id:
        description: "Stage-receipt artifact id from the staged run summary"
        required: true
      stage_receipt_artifact_digest:
        description: "Stage-receipt artifact sha256 digest from the staged run summary"
        required: true
      stage_id:
        description: "npm stage id from the staged run"
        required: true
      draft_release_id:
        description: "GitHub draft release id captured before staging"
        required: true
      version:
        description: "Exact version, e.g. 0.1.0-pre.4"
        required: true
      target:
        description: "Release target from release/targets.json"
        type: choice
        options: ["successor", "bridge", "rehearsal-reject", "rehearsal-approve"]
        default: "successor"
      mode:
        description: "dry-run (default) verifies/prints; live verifies registry + publishes draft"
        type: choice
        options: ["dry-run", "live"]
        default: "dry-run"

permissions: {}

concurrency:
  group: release-finalize-${{ inputs.target }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode }}
  ARTIFACT_DIR: release-candidate
  RECEIPT_DIR: release-stage-receipt

jobs:
  target-authorized:
    name: target-authorized - full release contract only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Refuse identity-only rehearsal targets
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FACTS="$(node scripts/release-resolve-target.mjs --target "$TARGET" --tag "v$VERSION")"
          test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).workflow_contract)' "$FACTS")" = "full" \
            || { echo "::error::identity-only rehearsal targets have no finalization path"; exit 1; }

  ordering-verified:
    name: approved — signed operator receipt ordering gate
    needs: target-authorized
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      # contents:write is held ONLY because GitHub gates DRAFT-release VISIBILITY behind write —
      # a read token 403s on GET releases/<id> for an unpublished draft (live run 31507532220).
      # Every step in this job remains a pure read; the finalize job is still the only mutator.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download candidate by exact artifact id from the original run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.ARTIFACT_DIR }}
          merge-multiple: true

      - name: Download stage receipt by exact artifact id from the original run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.stage_receipt_artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.RECEIPT_DIR }}
          merge-multiple: true

      - name: Query independent artifact and draft metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECEIPT_ARTIFACT_ID: ${{ inputs.stage_receipt_artifact_id }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_ARTIFACT_ID:$RECEIPT_ARTIFACT_ID:$DRAFT_RELEASE_ID" in
            *[!0-9:]*) echo "::error::artifact and release ids must be decimal integers"; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > candidate-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID" > receipt-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > draft-release.json

      - name: Verify the complete immutable receipt chain
        env:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECEIPT_ARTIFACT_ID: ${{ inputs.stage_receipt_artifact_id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ inputs.stage_receipt_artifact_digest }}
          STAGE_ID: ${{ inputs.stage_id }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          node scripts/release-resolve-target.mjs --target "$TARGET" --tag "v$VERSION" >/dev/null
          node scripts/release-verify-chain.mjs verify-finalizer \
            --candidate "$ARTIFACT_DIR/candidate.json" --receipt "$RECEIPT_DIR/stage-receipt.json" \
            --candidate-artifact candidate-artifact.json --receipt-artifact receipt-artifact.json \
            --release draft-release.json --run-id "$RUN_ID" --artifact-id "$ARTIFACT_ID" \
            --stage-receipt-artifact-id "$RECEIPT_ARTIFACT_ID" \
            --stage-receipt-artifact-digest "$RECEIPT_ARTIFACT_DIGEST" \
            --stage-id "$STAGE_ID" --draft-release-id "$DRAFT_RELEASE_ID" --version "$VERSION" \
            --out verified-chain.json

      - name: Download this candidate's signed operator receipts
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_ID: ${{ inputs.stage_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at > run-created-at.txt
          mkdir -p operator-receipts
          node scripts/release-verify-ordering.mjs assets --release draft-release.json --stage-id "$STAGE_ID" > receipt-assets.txt
          while read -r ASSET_ID ASSET_NAME; do
            case "$ASSET_ID" in *[!0-9]*) echo "::error::receipt asset id must be numeric"; exit 1 ;; esac
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "operator-receipts/$ASSET_NAME"
          done < receipt-assets.txt

      - name: Verify signed receipt ordering through the release-state machine
        run: |
          set -euo pipefail
          node scripts/release-verify-ordering.mjs verify \
            --mode "$MODE" --chain verified-chain.json --receipt "$RECEIPT_DIR/stage-receipt.json" \
            --release draft-release.json --receipts-dir operator-receipts \
            --run-created-at "$(cat run-created-at.txt)" \
            --allowed-signers .github/release-allowed-signers --out ordering-result.json

  registry-verify:
    name: registry_verified — integrity/signature/provenance/install proof
    needs: ordering-verified
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      # contents:write is held ONLY because GitHub gates DRAFT-release VISIBILITY behind write —
      # a read token 403s on GET releases/<id> for an unpublished draft (live run 31507532220).
      # Every step in this job remains a pure read; the finalize job is still the only mutator.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download candidate by exact artifact id from the original run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.ARTIFACT_DIR }}
          merge-multiple: true

      - name: Download stage receipt by exact artifact id from the original run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.stage_receipt_artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.RECEIPT_DIR }}
          merge-multiple: true

      - name: Query independent artifact and draft metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECEIPT_ARTIFACT_ID: ${{ inputs.stage_receipt_artifact_id }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_ARTIFACT_ID:$RECEIPT_ARTIFACT_ID:$DRAFT_RELEASE_ID" in
            *[!0-9:]*) echo "::error::artifact and release ids must be decimal integers"; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > candidate-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID" > receipt-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > draft-release.json

      - name: Verify the complete immutable receipt chain
        env:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECEIPT_ARTIFACT_ID: ${{ inputs.stage_receipt_artifact_id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ inputs.stage_receipt_artifact_digest }}
          STAGE_ID: ${{ inputs.stage_id }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          node scripts/release-resolve-target.mjs --target "$TARGET" --tag "v$VERSION" >/dev/null
          node scripts/release-verify-chain.mjs verify-finalizer \
            --candidate "$ARTIFACT_DIR/candidate.json" --receipt "$RECEIPT_DIR/stage-receipt.json" \
            --candidate-artifact candidate-artifact.json --receipt-artifact receipt-artifact.json \
            --release draft-release.json --run-id "$RUN_ID" --artifact-id "$ARTIFACT_ID" \
            --stage-receipt-artifact-id "$RECEIPT_ARTIFACT_ID" \
            --stage-receipt-artifact-digest "$RECEIPT_ARTIFACT_DIGEST" \
            --stage-id "$STAGE_ID" --draft-release-id "$DRAFT_RELEASE_ID" --version "$VERSION" \
            --out verified-chain.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm used for signature and provenance verification
        run: |
          set -euo pipefail
          npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.15.0"

      - name: Verify registry bytes, signatures, provenance, install, and build identity
        env:
          LIVE_RELEASE_ENABLED: ${{ vars.ASLITE_RELEASE_LIVE_ENABLED }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "live" ]; then
            test "$LIVE_RELEASE_ENABLED" = "true" || { echo "::error::release environment is not explicitly live-enabled"; exit 1; }
            node scripts/release-verify-registry.mjs --target "$TARGET" --version "$VERSION" \
              --manifest "$ARTIFACT_DIR/candidate.json" --out registry-proof.json
          else
            echo "[dry-run] verified immutable chain; would run the exact registry proof for $TARGET@$VERSION"
          fi

  finalize:
    name: final — publish the prepared draft only after re-verification
    needs: registry-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download candidate by exact artifact id from the original run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.ARTIFACT_DIR }}
          merge-multiple: true

      - name: Download stage receipt by exact artifact id from the original run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.stage_receipt_artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.RECEIPT_DIR }}
          merge-multiple: true

      - name: Query independent artifact and draft metadata again
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECEIPT_ARTIFACT_ID: ${{ inputs.stage_receipt_artifact_id }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_ARTIFACT_ID:$RECEIPT_ARTIFACT_ID:$DRAFT_RELEASE_ID" in
            *[!0-9:]*) echo "::error::artifact and release ids must be decimal integers"; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > candidate-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID" > receipt-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > draft-release.json

      - name: Re-verify the complete chain immediately before publication
        env:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECEIPT_ARTIFACT_ID: ${{ inputs.stage_receipt_artifact_id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ inputs.stage_receipt_artifact_digest }}
          STAGE_ID: ${{ inputs.stage_id }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          node scripts/release-resolve-target.mjs --target "$TARGET" --tag "v$VERSION" >/dev/null
          node scripts/release-verify-chain.mjs verify-finalizer \
            --candidate "$ARTIFACT_DIR/candidate.json" --receipt "$RECEIPT_DIR/stage-receipt.json" \
            --candidate-artifact candidate-artifact.json --receipt-artifact receipt-artifact.json \
            --release draft-release.json --run-id "$RUN_ID" --artifact-id "$ARTIFACT_ID" \
            --stage-receipt-artifact-id "$RECEIPT_ARTIFACT_ID" \
            --stage-receipt-artifact-digest "$RECEIPT_ARTIFACT_DIGEST" \
            --stage-id "$STAGE_ID" --draft-release-id "$DRAFT_RELEASE_ID" --version "$VERSION" \
            --out verified-chain.json

      - name: Re-download this candidate's signed operator receipts
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_ID: ${{ inputs.stage_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at > run-created-at.txt
          mkdir -p operator-receipts
          node scripts/release-verify-ordering.mjs assets --release draft-release.json --stage-id "$STAGE_ID" > receipt-assets.txt
          while read -r ASSET_ID ASSET_NAME; do
            case "$ASSET_ID" in *[!0-9]*) echo "::error::receipt asset id must be numeric"; exit 1 ;; esac
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "operator-receipts/$ASSET_NAME"
          done < receipt-assets.txt

      - name: Re-verify signed receipt ordering immediately before publication
        run: |
          set -euo pipefail
          node scripts/release-verify-ordering.mjs verify \
            --mode "$MODE" --chain verified-chain.json --receipt "$RECEIPT_DIR/stage-receipt.json" \
            --release draft-release.json --receipts-dir operator-receipts \
            --run-created-at "$(cat run-created-at.txt)" \
            --allowed-signers .github/release-allowed-signers --out ordering-result.json

      - name: Plan exact publication inventory and workflow-owned receipt status
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/release-verify-ordering.mjs plan --result ordering-result.json \
            --chain verified-chain.json --release draft-release.json --out-dir publication-out \
            --finalize-run-id "$FINALIZE_RUN_ID" --out publication-plan.json

      - name: Apply ID-only cleanup, retry-safe status --clobber, and owned body normalization
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_RELEASE_ENABLED: ${{ vars.ASLITE_RELEASE_LIVE_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "live" ]; then
            test "$LIVE_RELEASE_ENABLED" = "true" || { echo "::error::release environment is not explicitly live-enabled"; exit 1; }
          fi
          node scripts/release-verify-ordering.mjs apply --mode "$MODE" --plan publication-plan.json \
            --repo "$GITHUB_REPOSITORY" --out-dir publication-out

      - name: Re-query and prove exact final inventory and owned body before publication
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "live" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > final-draft-release.json
            node scripts/release-verify-ordering.mjs final --release final-draft-release.json \
              --plan publication-plan.json --out final-publication-proof.json
            node scripts/release-run-operations.mjs --op immutable-release \
              --target "$TARGET" --version "$VERSION" --release-id "$DRAFT_RELEASE_ID" --execute
          else
            node scripts/release-run-operations.mjs --op immutable-release \
              --target "$TARGET" --version "$VERSION" --release-id "$DRAFT_RELEASE_ID"
          fi
