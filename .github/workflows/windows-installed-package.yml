name: Windows installed-package proof

# Explicit release-candidate or support check. This preserves the native Windows Node 22 runtime
# contract and Node 20 installed-package proof without adding its nearly hour-long runtime to
# every pull request or push to main. Dispatch against the exact candidate ref from Actions, or:
# gh workflow run windows-installed-package.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installed-package-${{ github.ref }}
  cancel-in-progress: false

env:
  AGENTSTATE_LITE_NO_AUTOPULL: 1

jobs:
  windows:
    name: native Windows runtime and installed package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the complete workspace contract natively
        run: npm run ci:runtime
      - name: Build, pack, and verify the publishable artifact
        shell: pwsh
        run: |
          npm run build:npm-package -w superbee
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = npm run --silent pack:npm-package -- --pack-destination $env:RUNNER_TEMP | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($receipt.Count -ne 1) { throw "npm package packer did not emit exactly one receipt" }
          $tarball = Join-Path $env:RUNNER_TEMP $receipt[0].filename
          npm run verify:npm-package:tarball -- $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SUPERBEE_WINDOWS_TARBALL=$tarball" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and drive the packed CLI on the engine floor
        shell: pwsh
        run: |
          if (-not (node --version).StartsWith("v20.")) { throw "Node 20 is not active" }
          $prefix = Join-Path $env:RUNNER_TEMP "installed-superbee"
          npm install --global $env:SUPERBEE_WINDOWS_TARBALL --prefix $prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cli = Join-Path $prefix "superbee.cmd"
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw "npm did not install superbee.cmd" }
          $entrypoint = Join-Path $prefix "node_modules\superbee\dist\superbee.mjs"
          if (-not (Test-Path -LiteralPath $entrypoint -PathType Leaf)) { throw "npm did not install the Superbee entrypoint" }
          $dir = Join-Path $env:RUNNER_TEMP "windows-smoke-bundle"
          & $cli init --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli doc write specs/auth --type Spec --title Auth --body "smoke body" --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli doc read specs/auth --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli doc write notes/one --type Note --title One --body x --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli link add specs/auth notes/one --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli link show specs/auth --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli list --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli status --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SUPERBEE_WINDOWS_INSTALLED_ENTRYPOINT = $entrypoint
          $env:SUPERBEE_WINDOWS_INSTALLED_PREFIX = $prefix
          node scripts/windows-installed-package-proof.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
