name: Release (build once, publish on npm)

# Provider-native release. Pushing a `v<version>` tag builds the package exactly once, proves the
# packed tarball, and publishes those literal bytes on npm through OIDC trusted publishing with
# provenance. The release gate is the reviewed merge to main (or the release branch), the protected
# tag, and the `release` environment; no human npm step follows. The last job dispatches
# release-finalize.yml to verify the registry and create the GitHub release.
# TRANSITIONAL: until every trusted publisher allows `npm publish`, a failed publish falls back to
# `npm stage publish` and prints the old human gate (`npm stage approve`, then dispatch finalize).
#
# Gotchas encoded here cost a burned version number each; keep the comments with their run IDs.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # No secrets, no OIDC, no write scopes: payload code (dependencies, build, tests) runs here and
    # nowhere else. Lifecycle scripts are disabled; the CLI is a self-contained esbuild bundle.
    # checks: read exists only to consume the CI verdict already recorded on the tagged commit.
    name: build and prove the package once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      tgz: ${{ steps.meta.outputs.tgz }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Check Node runtime policy before installation
        run: node scripts/node-runtime-policy.mjs
      - run: npm ci --ignore-scripts
      - name: Resolve version and dist-tag from the tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$(node -p 'require("./packages/superbee/package.json").version')"
          test "v$V" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match packages/superbee version $V"; exit 1; }
          # Prereleases are tagged from protected main. A stable promotion may instead use the
          # version-only commit on release/<stable-version>, based on a retained prerelease tag;
          # its exact CI verdict below remains mandatory. No other branch can feed publication.
          case "$V" in
            *-*) SOURCE_REF=main ;;
            *) SOURCE_REF="release/$V" ;;
          esac
          REL="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_REF...$GITHUB_SHA" --jq .status)" || { echo "::error::cannot compare $GITHUB_SHA with $SOURCE_REF"; exit 1; }
          case "$REL" in identical|behind) ;; *) echo "::error::tag commit $GITHUB_SHA is not on $SOURCE_REF (compare status: $REL)"; exit 1 ;; esac
          case "$V" in *-*) T=next ;; *) T=latest ;; esac
          # npm applies the dist-tag unconditionally on publish (or stage approval), so a version
          # below the tag's current value would move it backwards. Refuse here, before anything is built,
          # and refuse when the registry cannot be read: never build blind.
          TAGS="$(npm view superbee dist-tags --json)" || { echo "::error::cannot read npm dist-tags for superbee; refusing to build without them"; exit 1; }
          node --input-type=module -e '
            import { compareStrictSemver } from "./scripts/strict-semver.mjs";
            const [v, t, tags] = process.argv.slice(1);
            const cur = JSON.parse(tags)[t];
            if (cur === undefined) process.exit(0); // the tag does not exist yet
            const c = compareStrictSemver(v, cur);
            if (c === undefined || c <= 0) { console.error(`::error::${v} would not advance the npm ${t} tag (currently ${cur}); backports need a different tag and are not supported by this workflow`); process.exit(1); }
          ' -- "$V" "$T" "$TAGS"
          {
            echo "version=$V"
            echo "dist_tag=$T"
            echo "tgz=superbee-$V.tgz"
            echo "source_ref=$SOURCE_REF"
          } >> "$GITHUB_OUTPUT"
      - name: Require the CI verdict already recorded on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
        run: |
          set -euo pipefail
          # Release-source validation consumes the newest CI verdict already recorded on this exact
          # commit — ordinarily the push-to-main run; a rerun or manual dispatch of the same
          # workflow counts equally — and never reruns CI. The newest repository-workflow check run
          # named after the canonical required context decides. A pending or not-yet-visible verdict
          # is polled briefly (a full CI run takes ~6 minutes); a failed, missing, or unqueryable
          # verdict refuses fail-closed: never publish bytes whose source CI cannot vouch for.
          for attempt in $(seq 1 16); do
            VERDICT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20required%20lanes&filter=latest&per_page=100" \
              --jq '([.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last) as $r
                | if $r == null then "missing"
                  elif $r.status != "completed" then "pending"
                  elif $r.conclusion == "success" then "success"
                  else "concluded:" + ($r.conclusion // "unknown") end')" \
              || { echo "::error::cannot query check runs for $GITHUB_SHA; refusing to build without the CI verdict"; exit 1; }
            case "$VERDICT" in
              success) break ;;
              missing|pending) echo "CI required lanes not settled on $GITHUB_SHA yet (attempt $attempt: $VERDICT)"; if [ "$attempt" -lt 16 ]; then sleep 30; fi ;;
              *) echo "::error::CI required lanes on $GITHUB_SHA is '$VERDICT'; fix CI on $SOURCE_REF before tagging"; exit 1 ;;
            esac
          done
          test "$VERDICT" = "success" || { echo "::error::no successful 'CI required lanes' verdict appeared on $GITHUB_SHA (last state: $VERDICT); wait for or dispatch CI on $SOURCE_REF, then re-push the tag"; exit 1; }
      - name: Build the npm-package bundle from this exact clean checkout
        # Through npm on purpose: the build rebuilds the embedded UI with the running npm.
        run: npm run build:npm-package -w superbee
      - name: Pack once and prove the packed tarball (installed smoke, file allowlist, one bin)
        id: pack
        run: |
          set -euo pipefail
          mkdir -p out
          npm run --silent pack:npm-package -- --pack-destination out > pack.json
          test "$(node -p 'require("./pack.json").length')" = "1"
          test -f "out/${{ steps.meta.outputs.tgz }}" || { echo "::error::expected out/${{ steps.meta.outputs.tgz }}"; ls out; exit 1; }
          npm run verify:npm-package:tarball -- "out/${{ steps.meta.outputs.tgz }}"
          echo "sha256=$(shasum -a 256 "out/${{ steps.meta.outputs.tgz }}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tgz
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 90

  publish:
    # Runs no payload code: it downloads the proven tarball, attests it, and hands the literal file
    # to npm. `environment: release` is what the npm trusted publisher is bound to.
    name: publish the exact tarball on npm (OIDC)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      attestations: write
      contents: read
    outputs:
      mode: ${{ steps.publish.outputs.mode }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tgz
          path: out
      - name: Re-hash the bytes about to be published
        run: |
          set -euo pipefail
          test "$(shasum -a 256 "out/${{ needs.build.outputs.tgz }}" | cut -d' ' -f1)" = "${{ needs.build.outputs.sha256 }}" \
            || { echo "::error::tarball digest changed between build and publish"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ needs.build.outputs.tgz }}
      # registry-url is load-bearing: npm writes the exchanged OIDC token into the user config layer
      # this creates (npm oidc.js). Removing it produced ENEEDAUTH in run 31975597582.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Pin an npm with trusted publishing and staged publishing
        run: |
          set -euo pipefail
          npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.15.0"
      - name: Publish the literal tarball with its final dist-tag
        id: publish
        env:
          PKG: superbee
          V: ${{ needs.build.outputs.version }}
          TGZ: ${{ needs.build.outputs.tgz }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # The leading ./ is load-bearing: npm parses a bare dir/file.tgz as github:owner/repo
          # shorthand (run 31499362043). --loglevel verbose is where npm reports a failed OIDC
          # exchange (run 31972609262).
          LOCAL="sha512-$(node -e 'process.stdout.write(require("crypto").createHash("sha512").update(require("fs").readFileSync(process.argv[1])).digest("base64"))' "./out/$TGZ")"
          # Re-run safety: a version npm already serves must be exactly these bytes; never publish twice.
          # Read anonymously: the registry-url user config carries setup-node's placeholder token.
          SERVED="$(NPM_CONFIG_USERCONFIG=/dev/null npm view "$PKG@$V" dist.integrity 2>/dev/null || true)"
          if [ -n "$SERVED" ]; then
            test "$SERVED" = "$LOCAL" || { echo "::error::npm already serves $PKG@$V as $SERVED, not this run's tarball ($LOCAL)"; exit 1; }
            echo "$PKG@$V is already published with these exact bytes; nothing to publish"
            echo "mode=published" >> "$GITHUB_OUTPUT"
          elif npm publish "./out/$TGZ" --tag "$DIST_TAG" --access public --provenance --ignore-scripts --loglevel verbose 2>&1 | tee publish.log; then
            echo "mode=published" >> "$GITHUB_OUTPUT"
          else
            # TRANSITIONAL: remove once every trusted publisher allows npm publish. Until then OIDC
            # `npm publish` fails auth while `npm stage publish` is still allowed.
            CODE="$(grep -oE '\bE[0-9]{3}\b|ENEEDAUTH|EOTP' publish.log 2>/dev/null | head -n 1 || true)"
            echo "::warning::$PKG not published directly (${CODE:-no npm error code}); falling back to npm stage publish for human approval"
            echo "- $PKG: not published directly (${CODE:-no npm error code}); staged for human approval instead" >> "$GITHUB_STEP_SUMMARY"
            npm stage publish "./out/$TGZ" --tag "$DIST_TAG" --provenance --json --loglevel verbose > stage.json
            STAGE_ID="$(node -e '
              const j = JSON.parse(require("fs").readFileSync("stage.json", "utf8"));
              const find = (v) => v && typeof v === "object" ? (typeof v.stageId === "string" ? v.stageId : Object.values(v).map(find).find(Boolean)) : undefined;
              const id = find(j); if (!id) { console.error(JSON.stringify(j)); process.exit(1); } process.stdout.write(id);
            ')"
            { echo "mode=staged"; echo "stage_id=$STAGE_ID"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Record the publication
        if: steps.publish.outputs.mode == 'published'
        env:
          V: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          {
            echo "## superbee@$V published on npm (dist-tag \`$DIST_TAG\`, provenance)"
            echo ""
            echo "- tarball sha256: \`$SHA256\`"
            echo "- release-finalize.yml is dispatched automatically by the next job."
          } >> "$GITHUB_STEP_SUMMARY"
      # TRANSITIONAL: remove once every trusted publisher allows npm publish.
      - name: Print the human gate
        if: steps.publish.outputs.mode == 'staged'
        env:
          STAGE_ID: ${{ steps.publish.outputs.stage_id }}
          V: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          {
            echo "## superbee@$V staged on npm (dist-tag \`$DIST_TAG\` applies on approval)"
            echo ""
            echo "Direct publish failed (transitional fallback): the npm trusted publisher does not allow \`npm publish\` yet."
            echo ""
            echo "- stage id: \`$STAGE_ID\`"
            echo "- tarball sha256: \`$SHA256\`"
            echo ""
            echo "Inspect, then approve with 2FA (nothing is public until you do):"
            echo ""
            echo '```sh'
            echo "npm stage download $STAGE_ID && shasum -a 256 superbee-$V-$STAGE_ID.tgz   # must equal the sha256 above"
            echo "npm stage approve $STAGE_ID"
            echo "gh workflow run release-finalize.yml -f version=$V"
            echo '```'
            echo ""
            echo "To withdraw instead: \`npm stage reject $STAGE_ID\`. The next tag may reuse a higher number."
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    # Only a direct publish dispatches the finalizer; a staged fallback waits for human approval.
    # A GITHUB_TOKEN `gh workflow run` dispatch does create a run. The finalizer queues behind this
    # run in the shared `release` concurrency group and holds no registry credential.
    # A pending finalizer can be cancelled if another tag of the same family is pushed meanwhile
    # (only one pending run per group); then re-dispatch it by hand with the printed version.
    name: dispatch the registry finalizer
    needs: [build, publish]
    if: needs.publish.outputs.mode == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch release-finalize.yml for this version
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release-finalize.yml -R "$GITHUB_REPOSITORY" --ref main -f version="$V"
          echo "Dispatched release-finalize.yml for superbee@$V" >> "$GITHUB_STEP_SUMMARY"
