name: Release policy audit

# Registry-observing enforcement of the release conventions (decisions/version-update-contract):
# scripts/release-audit-tags.mjs compares the LIVE npm state of the successor package the release
# manifest declares (dist-tags,
# published versions, publish times) plus packages/cli/package.json against the declared policy.
#
# Two authorities compose in that comparison and neither restates the other: scripts/release-state.mjs
# `resolveTags` owns the phase machine (which tags move during a transaction, given the phase declared
# in release/phase.json), and release/targets.json owns dist-tag eligibility (a tuple's npm_tag plus
# npm_promote_tag are the only dist-tags its version may ever carry). A version the manifest publishes
# to `next` only therefore leaves `latest` where it is, and the audit expects exactly that — change the
# manifest and this audit's expectation moves with it, with no second edit anywhere.
#
# Deliberately a SEPARATE workflow, NOT part of the offline `npm run check` chain: ordinary gates
# run with the network off (local-first), and this audit is only meaningful online. The
# NETWORK-vs-VIOLATION distinction is structural, carried by the script's exit code:
#   0  -> policy holds (green)
#   20 -> registry unreachable/unhealthy: policy NOT evaluated -> loud warning, job stays green
#   anything else -> policy violation or audit defect -> red
#
# No npm ci: this read-only audit executes the checked-in source entrypoint directly and imports
# only repository source modules plus Node builtins; it does not need installed package deps.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: registry vs release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Audit live registry state against the declared release phase
        run: |
          set +e
          node scripts/release-audit-tags.mjs
          code=$?
          set -e
          if [ "$code" -eq 20 ]; then
            echo "::warning title=release-audit neutral::npm registry unreachable - release-policy audit did NOT run (network condition, not a policy violation)"
            exit 0
          fi
          exit "$code"
