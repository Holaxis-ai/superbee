name: Release policy audit

# Registry-observing enforcement of the release conventions (decisions/version-update-contract):
# scripts/release-audit-tags.mjs compares each LIVE npm coordinate against its immutable reviewed
# policy file. Bridge and Superbee have independent coordinates and no mutable source phase.
#
# Deliberately a SEPARATE workflow, NOT part of the offline `npm run check` chain: ordinary gates
# run with the network off (local-first), and this audit is only meaningful online. The
# NETWORK-vs-VIOLATION distinction is structural, carried by the script's exit code:
#   0  -> policy holds (green)
#   20 -> registry unreachable/unhealthy: policy NOT evaluated -> loud warning, job stays green
#   anything else -> policy violation or audit defect -> red
#
# No npm ci: the script imports only node builtins and local release-state/targets helpers.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: registry vs release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Audit live registry state against immutable coordinate policies
        run: |
          set +e
          npm run release:audit-tags -- --coordinate bridge --policy-file release/bridge-phase.json
          bridge_code=$?
          npm run release:audit-tags -- --coordinate superbee --policy-file release/superbee-cutover.json
          superbee_code=$?
          set -e
          if [ "$bridge_code" -ne 0 ] && [ "$bridge_code" -ne 20 ]; then
            exit "$bridge_code"
          fi
          if [ "$superbee_code" -ne 0 ] && [ "$superbee_code" -ne 20 ]; then
            exit "$superbee_code"
          fi
          if [ "$bridge_code" -eq 20 ] || [ "$superbee_code" -eq 20 ]; then
            echo "::warning title=release-audit neutral::npm registry unreachable - release-policy audit did NOT run (network condition, not a policy violation)"
            exit 0
          fi
