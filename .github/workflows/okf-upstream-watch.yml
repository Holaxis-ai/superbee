name: OKF upstream watch

# Notices when the upstream OKF specification moves, instead of hearing it from users. Weekly, it
# compares the latest SPEC.md commit in the canonical OKF repository with the reviewed pin in
# scripts/okf-upstream-watch.json and reads every upstream sample bundle with the built CLI's
# `status --json`. (MCP SDK drift arrives as Dependabot PRs, see .github/dependabot.yml.)
#
# DELIBERATELY NOT A PR GATE: this workflow only reports. It never commits, pushes or opens PRs.
# Drift opens at most one `upstream-drift` issue per drift key (a hidden marker in the body); an
# open or closed issue with that marker suppresses a repeat. A human reviews the issue, adapts
# Superbee if needed, and bumps the pin in the same PR. Watcher failures (network, API) open a
# separate "Upstream watch failing" issue instead of reporting drift.
#
# The `check` job reads upstream content with no write permission and no npm cache (a scheduled
# main run must not save a ~/.npm that other workflows restore); it only uploads a small JSON
# result. The `report` job holds `issues: write`, checks out this repository only, runs no npm
# install and reads no upstream content, re-validates the JSON strictly, and is the only writer of
# the job summary and issues. Manual dispatch defaults to dry run, which prints the would-be issue
# in the summary instead.
on:
  schedule:
    - cron: "41 6 * * 1" # weekly, Monday 06:41 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the would-be issue instead of opening it"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: okf-upstream-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - run: npm ci

      - run: npm run build

      - name: Collect OKF result
        # The read-only token only raises the GitHub API rate limit for public commit lookups.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/okf-upstream-watch.mjs --collect "$RUNNER_TEMP/okf-upstream-watch/result.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okf-upstream-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/okf-upstream-watch/result.json
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: check
    if: ${{ !cancelled() && needs.check.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Download OKF result
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: okf-upstream-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/okf-upstream-watch

      - name: Report OKF result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/okf-upstream-watch.mjs report --input "$RUNNER_TEMP/okf-upstream-watch/result.json" --dry-run
          else
            node scripts/okf-upstream-watch.mjs report --input "$RUNNER_TEMP/okf-upstream-watch/result.json"
          fi
