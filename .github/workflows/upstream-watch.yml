name: Upstream watch

# Notices when the upstream specifications Superbee depends on move, instead of hearing it from
# users. `okf` (weekly) compares the latest SPEC.md commit in the canonical OKF repository with the
# reviewed pin in scripts/upstream-watch.json and reads every upstream sample bundle with the built
# CLI's `status --json`. `mcp` (daily) compares npm `latest` for the MCP SDK packages with their
# pins and, when one is newer, installs it into the mcp-app workspace (never committed) and runs
# build, typecheck and the mcp-app tests against it.
#
# DELIBERATELY NOT A PR GATE: this workflow only reports. Each run writes a job summary; drift or a
# conformance failure opens at most one `upstream-drift` issue per deterministic title, and an
# open or closed issue with that title suppresses a repeat. It never commits, pushes or opens PRs.
# A human reviews the issue, adapts Superbee if needed, and bumps the pin in the same PR.
#
# Upstream content is untrusted: it reaches the script only as data, never through `${{ }}` into a
# shell, and the script passes argv arrays to child processes and the issue body as JSON.
# Manual dispatch defaults to dry run, which prints the would-be issue in the summary instead.
on:
  schedule:
    - cron: "41 6 * * 1" # okf: weekly, Monday 06:41 UTC
    - cron: "29 6 * * *" # mcp: daily, 06:29 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Which upstream to check"
        type: choice
        options: [both, okf, mcp]
        default: both
      dry_run:
        description: "Print the would-be issue instead of opening it"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: upstream-watch-${{ github.event_name }}-${{ github.event.schedule || inputs.target }}
  cancel-in-progress: false

jobs:
  okf:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 6 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.target != 'mcp') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check OKF upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/upstream-watch.mjs okf --dry-run
          else
            node scripts/upstream-watch.mjs okf
          fi

  mcp:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '29 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.target != 'okf') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - name: Check MCP upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/upstream-watch.mjs mcp --verify --dry-run
          else
            node scripts/upstream-watch.mjs mcp --verify
          fi
