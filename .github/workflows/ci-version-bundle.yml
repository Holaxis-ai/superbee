name: CI version + bundle automation

# Every main push runs the deterministic generator once. Drift is proposed from the fixed
# automation branch through an ordinary reviewed PR; convergence is a no-op, including after that
# PR merges. Inspect has only the normal read token. A repository-scoped App token exists only for
# a canonical mutation-required plan, and apply revalidates main, local bytes/modes, the branch,
# and the complete same-head PR inventory before using it. A race fails closed for the next queued
# main event; there is no reset/rebase, direct-main push, branch deletion, approval, or merge path.
on:
  push:
    branches: [main]

concurrency:
  group: ci-version-bundle-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  propose-version-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Regenerate and bump if needed
        run: npm run ci:version-bundle

      - name: Inspect canonical branch and PR plan
        id: inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-version-bundle-pr.mjs inspect --plan "$RUNNER_TEMP/version-bundle-plan.json"

      - name: Mint repository-scoped version-bundle App token
        id: app-token
        if: steps.inspect.outputs.needs_mutation == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.VERSION_BUNDLE_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_BUNDLE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Apply canonical branch and PR plan
        if: steps.inspect.outputs.needs_mutation == 'true'
        env:
          VERSION_BUNDLE_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/ci-version-bundle-pr.mjs apply --plan "$RUNNER_TEMP/version-bundle-plan.json"
