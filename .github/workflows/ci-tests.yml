name: CI tests

# Runtime-sensitive suites run identically on Node 22 and 26, then once more on macOS so that
# tests whose native branch only executes on a case-aliasing filesystem actually run. Distribution,
# browser/UI, local release policy, and exhaustive target proofs are platform-independent lanes on
# one supported runtime. The separate `windows-installed-package.yml` workflow retains the native
# Windows and Node 20 package proof as an explicit manual release-candidate check. The first
# implementation is deliberately unconditional: path
# classification and skip receipts require a separate fail-closed classifier contract.
#
# Branch-protection migration is additive. Observe `CI required lanes` on an exact SHA, add its
# app-bound context, then remove the two legacy `gate (node N)` requirements. Roll back by restoring
# the legacy requirements before removing the canonical one. The compatibility jobs stay until a
# later workflow cleanup. `merge_group` is deferred because this repository has no merge-queue
# workflow or settings evidence; add that trigger before enabling a merge queue.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGENTSTATE_LITE_NO_AUTOPULL: 1

jobs:
  runtime:
    name: runtime compatibility (node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPERBEE_TEST_EXPECT_ALIASING_HOST: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Confirm the runner filesystem does not alias case
        run: mkdir -p "$RUNNER_TEMP/host-probe" && touch "$RUNNER_TEMP/host-probe/probe-name" && test ! -e "$RUNNER_TEMP/host-probe/PROBE-NAME"
      - name: Run the identical runtime-sensitive contract
        run: npm run ci:runtime

  aliasing-host:
    name: host-class proofs on an aliasing host (macos, node 26)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SUPERBEE_TEST_EXPECT_ALIASING_HOST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Confirm the runner filesystem aliases case
        run: mkdir -p "$RUNNER_TEMP/host-probe" && touch "$RUNNER_TEMP/host-probe/probe-name" && test -e "$RUNNER_TEMP/host-probe/PROBE-NAME"
      - name: Run the host-class-dependent proofs on a case-aliasing filesystem
        run: npm run ci:aliasing-host

  distribution:
    name: distribution package and installed behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run ci:distribution

  browser:
    name: browser and UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Verify baked Playwright browser artifacts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { constants } from "node:fs";
          import { access, readFile } from "node:fs/promises";
          import path from "node:path";

          assert.equal(process.platform, "linux", "the browser container must run Linux");
          assert.equal(process.arch, "x64", "the browser job is pinned to GitHub's x64 runner");
          const root = process.env.PLAYWRIGHT_BROWSERS_PATH;
          assert.equal(root, "/ms-playwright", "the baked browser registry path must remain explicit");
          const manifest = JSON.parse(await readFile("node_modules/playwright-core/browsers.json", "utf8"));
          const browser = (name) => {
            const matches = manifest.browsers.filter((entry) => entry.name === name);
            assert.equal(matches.length, 1, `Playwright must declare exactly one ${name} artifact`);
            assert.equal(matches[0].installByDefault, true, `${name} must remain installed by default`);
            return matches[0];
          };
          const chromium = browser("chromium");
          const headless = browser("chromium-headless-shell");
          const ffmpeg = browser("ffmpeg");
          assert.equal(chromium.revision, headless.revision, "Chromium revisions must stay aligned");
          const required = [
            [path.join(root, `chromium-${chromium.revision}`, "INSTALLATION_COMPLETE"), constants.F_OK],
            [path.join(root, `chromium-${chromium.revision}`, "chrome-linux64", "chrome"), constants.X_OK],
            [path.join(root, `chromium_headless_shell-${headless.revision}`, "INSTALLATION_COMPLETE"), constants.F_OK],
            [path.join(root, `chromium_headless_shell-${headless.revision}`, "chrome-headless-shell-linux64", "chrome-headless-shell"), constants.X_OK],
            [path.join(root, `ffmpeg-${ffmpeg.revision}`, "INSTALLATION_COMPLETE"), constants.F_OK],
            [path.join(root, `ffmpeg-${ffmpeg.revision}`, "ffmpeg-linux"), constants.X_OK],
          ];
          for (const [artifact, mode] of required) await access(artifact, mode);
          NODE
      - run: npm run ci:browser

  scripts:
    name: repository scripts and CI topology
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run ci:scripts

  smoke-node-20:
    name: built-CLI smoke on the engines floor (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Drive the built bundle on Node 20
        run: |
          node --version | grep -q '^v20\.'
          CLI=packages/cli/dist/superbee.mjs
          DIR="$RUNNER_TEMP/smoke-bundle"
          node "$CLI" init --dir "$DIR"
          node "$CLI" doc write specs/auth --type Spec --title "Auth" --body "smoke body" --dir "$DIR"
          node "$CLI" doc read specs/auth --dir "$DIR"
          node "$CLI" doc write notes/one --type Note --title "One" --body "x" --dir "$DIR"
          node "$CLI" link add specs/auth notes/one --dir "$DIR"
          node "$CLI" link show specs/auth --dir "$DIR"
          node "$CLI" list --dir "$DIR"
          node "$CLI" status --dir "$DIR"

  required:
    name: CI required lanes
    needs: [runtime, aliasing-host, smoke-node-20, distribution, browser, scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Reject every non-success or missing required result
        env:
          REQUIRED_RESULTS_JSON: ${{ toJSON(needs) }}
        run: npm run ci:aggregate

  compatibility-gate-node-22:
    name: gate (node 22)
    needs: [runtime, aliasing-host, smoke-node-20, distribution, browser, scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Preserve the legacy context without weakening its coverage
        env:
          REQUIRED_RESULTS_JSON: ${{ toJSON(needs) }}
        run: npm run ci:aggregate

  compatibility-gate-node-26:
    name: gate (node 26)
    needs: [runtime, aliasing-host, smoke-node-20, distribution, browser, scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Preserve the legacy context without weakening its coverage
        env:
          REQUIRED_RESULTS_JSON: ${{ toJSON(needs) }}
        run: npm run ci:aggregate
