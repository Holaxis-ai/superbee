name: CI tests

# Runtime-sensitive suites run identically on Node 22 and 26, then once more on macOS so that
# tests whose native branch only executes on a case-aliasing filesystem actually run. A native
# Windows lane runs the full workspace contract on Node 22, then installs the exact packed artifact
# and drives its public CLI on the Node 20 engine floor. Distribution, browser/UI, local release
# policy, and exhaustive target proofs are platform-independent lanes on one supported runtime. The
# first implementation is deliberately unconditional: path
# classification and skip receipts require a separate fail-closed classifier contract.
#
# Branch-protection migration is additive. Observe `CI required lanes` on an exact SHA, add its
# app-bound context, then remove the two legacy `gate (node N)` requirements. Roll back by restoring
# the legacy requirements before removing the canonical one. The compatibility jobs stay until a
# later workflow cleanup. `merge_group` is deferred because this repository has no merge-queue
# workflow or settings evidence; add that trigger before enabling a merge queue.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGENTSTATE_LITE_NO_AUTOPULL: 1

jobs:
  runtime:
    name: runtime compatibility (node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPERBEE_TEST_EXPECT_ALIASING_HOST: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Confirm the runner filesystem does not alias case
        run: mkdir -p "$RUNNER_TEMP/host-probe" && touch "$RUNNER_TEMP/host-probe/probe-name" && test ! -e "$RUNNER_TEMP/host-probe/PROBE-NAME"
      - name: Run the identical runtime-sensitive contract
        run: npm run ci:runtime

  aliasing-host:
    name: host-class proofs on an aliasing host (macos, node 26)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SUPERBEE_TEST_EXPECT_ALIASING_HOST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Confirm the runner filesystem aliases case
        run: mkdir -p "$RUNNER_TEMP/host-probe" && touch "$RUNNER_TEMP/host-probe/probe-name" && test -e "$RUNNER_TEMP/host-probe/PROBE-NAME"
      - name: Run the host-class-dependent proofs on a case-aliasing filesystem
        run: npm run ci:aliasing-host

  windows:
    name: native Windows runtime and installed package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the complete workspace contract natively
        run: npm run ci:runtime
      - name: Build, pack, and verify the publishable artifact
        shell: pwsh
        run: |
          npm run build:npm-package -w superbee
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = npm pack ./packages/cli --ignore-scripts --pack-destination $env:RUNNER_TEMP | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tarball = Join-Path $env:RUNNER_TEMP $name.Trim()
          npm run verify:npm-package:tarball -- $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SUPERBEE_WINDOWS_TARBALL=$tarball" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and drive the packed CLI on the engine floor
        shell: pwsh
        run: |
          if (-not (node --version).StartsWith("v20.")) { throw "Node 20 is not active" }
          $prefix = Join-Path $env:RUNNER_TEMP "installed-superbee"
          npm install --global $env:SUPERBEE_WINDOWS_TARBALL --prefix $prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cli = Join-Path $prefix "superbee.cmd"
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw "npm did not install superbee.cmd" }
          $dir = Join-Path $env:RUNNER_TEMP "windows-smoke-bundle"
          & $cli init --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli doc write specs/auth --type Spec --title Auth --body "smoke body" --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli doc read specs/auth --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli doc write notes/one --type Note --title One --body x --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli link add specs/auth notes/one --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli link show specs/auth --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli list --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli status --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  distribution:
    name: distribution package and installed behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run ci:distribution

  browser:
    name: browser and UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: packages/ui
      - run: npm run ci:browser

  scripts:
    name: repository scripts and CI topology
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run ci:scripts

  smoke-node-20:
    name: built-CLI smoke on the engines floor (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Drive the built bundle on Node 20
        run: |
          node --version | grep -q '^v20\.'
          CLI=packages/cli/dist/superbee.mjs
          DIR="$RUNNER_TEMP/smoke-bundle"
          node "$CLI" init --dir "$DIR"
          node "$CLI" doc write specs/auth --type Spec --title "Auth" --body "smoke body" --dir "$DIR"
          node "$CLI" doc read specs/auth --dir "$DIR"
          node "$CLI" doc write notes/one --type Note --title "One" --body "x" --dir "$DIR"
          node "$CLI" link add specs/auth notes/one --dir "$DIR"
          node "$CLI" link show specs/auth --dir "$DIR"
          node "$CLI" list --dir "$DIR"
          node "$CLI" status --dir "$DIR"

  required:
    name: CI required lanes
    needs: [runtime, aliasing-host, windows, smoke-node-20, distribution, browser, scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Reject every non-success or missing required result
        env:
          REQUIRED_RESULTS_JSON: ${{ toJSON(needs) }}
        run: npm run ci:aggregate

  compatibility-gate-node-22:
    name: gate (node 22)
    needs: [runtime, aliasing-host, windows, smoke-node-20, distribution, browser, scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Preserve the legacy context without weakening its coverage
        env:
          REQUIRED_RESULTS_JSON: ${{ toJSON(needs) }}
        run: npm run ci:aggregate

  compatibility-gate-node-26:
    name: gate (node 26)
    needs: [runtime, aliasing-host, windows, smoke-node-20, distribution, browser, scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Preserve the legacy context without weakening its coverage
        env:
          REQUIRED_RESULTS_JSON: ${{ toJSON(needs) }}
        run: npm run ci:aggregate
