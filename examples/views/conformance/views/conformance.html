<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="superbee-conformance-revision" content="7">
<title>View protocol conformance</title>
<style>
  /* Superbee View theme, the same tokens the shipped example Views use. */
  :root {
    --bg:#F3F7FA; --card:#FFFFFF; --alt:#E9EFF4; --rule:#DADEE2;
    --ink:#0F1A24; --slate:#4A5D6E; --ghost:#9AAAB8;
    --structure:#0073B0; --signal:#956300; --danger:#B00020;
    --sans:"DM Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0B1926; --card:#0F2A3F; --alt:#12314A; --rule:#26323D;
      --ink:#F8F6F2; --slate:#B7C4D1; --ghost:#7E8FA0;
      --structure:#3CAEF9; --signal:#E09707; --danger:#F2707A;
    }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:14px/1.5 var(--sans); padding:20px 24px 60px; }
  h1 { font-size:20px; font-weight:600; margin-bottom:4px; }
  .meta { color:var(--slate); font-family:var(--mono); font-size:12px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--rule); }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--rule); vertical-align:top; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--slate); background:var(--alt); }
  td.request, td.status { font-family:var(--mono); font-size:12.5px; white-space:nowrap; }
  td.summary { font-family:var(--mono); font-size:12px; color:var(--slate); word-break:break-word; }
  tr[data-status="answered"] td.status, tr[data-status="sent"] td.status { color:var(--structure); }
  tr[data-status="refused"] td.status, tr[data-status="skipped"] td.status { color:var(--signal); }
  tr[data-status="failed"] td.status { color:var(--danger); }
  #status { margin-top:12px; font-family:var(--mono); font-size:12px; color:var(--slate); }
</style>
</head>
<body>
<h1>View protocol conformance</h1>
<p class="meta">revision <span id="revision"></span> <span id="host">host: waiting for hello</span></p>
<table>
  <thead><tr><th>request</th><th>status</th><th>summary</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p id="status">running</p>
<script>
(function () {
  var PROTO = "v0", ACTION_PROTO = "v1", seq = 0, pending = {}, subs = [];
  function send(type, extra, proto) {
    return new Promise(function (resolve, reject) {
      var id = String(++seq);
      pending[id] = { resolve: resolve, reject: reject };
      var msg = { bridge: proto || PROTO, id: id, type: type };
      if (extra) for (var k in extra) msg[k] = extra[k];
      parent.postMessage(msg, "*"); // parent origin is opaque to us; the shell validates by source
    });
  }
  // A shell action, deliberately separate from send(): the source frame may unload immediately,
  // so openPage is void/fire-and-forget and must not be awaited.
  function openPage(pageId) {
    parent.postMessage({ bridge: PROTO, type: "open-page", pageId: pageId }, "*");
  }
  function watch(refresh) {
    if (typeof refresh !== "function") return Promise.reject(new TypeError("Bridge.watch requires a refresh function"));
    var active = true, ready = false, running = false, queued = [];
    function schedule(initial) {
      running = true;
      var batch = queued.splice(0);
      return Promise.resolve().then(function () { return refresh(batch); }).then(function (value) {
        running = false;
        if (queued.length) void schedule(false);
        return value;
      }, function (err) {
        running = false;
        if (queued.length) void schedule(false);
        if (initial) throw err;
        console.error("Bridge.watch refresh failed", err);
      });
    }
    function onChange(event) {
      if (!active) return;
      queued.push(event);
      if (ready && !running) void schedule(false);
    }
    return window.Bridge.subscribe(onChange).then(function () {
      ready = true;
      return schedule(true);
    }, function (err) {
      active = false;
      throw err;
    });
  }
  window.addEventListener("message", function (e) {
    if (e.source !== window.parent) return; // only trust the shell
    var m = e.data;
    if (!m || (m.bridge !== PROTO && m.bridge !== ACTION_PROTO)) return;
    if (m.type === "change") { subs.forEach(function (cb) { cb(m.event); }); return; }
    var p = pending[m.id];
    if (!p) return;
    delete pending[m.id];
    if (m.type === "error") {
      var err = new Error((m.error && m.error.message) || "bridge error");
      err.code = m.error && m.error.code; // one of USAGE, FORBIDDEN, REVOKED, TOO_LARGE, RUNTIME, NOT_FOUND
      p.reject(err);
    } else p.resolve(m.result);
  });
  window.Bridge = {
    hello: function () { return send("hello"); },
    query: function (params) { return send("query", { params: params }); },
    read: function (docId) { return send("read", { docId: docId }); },
    readVersioned: function (docId) { return send("read-versioned", { docId: docId }, ACTION_PROTO); },
    renderDocument: function (docId) { return send("render-document", { docId: docId }); },
    edges: function (params) { return send("edges", { params: params }); },
    graph: function (includeBodies) { return send("graph", includeBodies === undefined ? undefined : { includeBodies: includeBodies === true }); },
    host: function (capability, input) {
      return send("host", input === undefined ? { capability: capability } : { capability: capability, input: input });
    },
    openPage: openPage,
    subscribe: function (cb) { subs.push(cb); return send("subscribe"); },
    watch: watch
  };
})();

// Conformance run. One row per request type, in the order docs/VIEW-PROTOCOL.md lists them, a
// query-newest row when the host declares query.newest, and one burst row that keeps 12 reads in
// flight at once: a host may cap concurrency but must queue or refuse the excess with an error
// reply, never drop it, so the row expects every result. Revisions 5 and 6 add rows judged against
// the host's own hello: relationships, a limit above limits.query, a multi-value field, open: true,
// more on a capped reply, and a read and read-versioned of a missing document. A declared feature
// must be answered correctly; an undeclared one must be refused (FORBIDDEN for a request, USAGE for
// a query feature), never silently ignored. Revision 7 adds edges rows over the fixed edges/
// documents the expected table lists: each answer must equal Core's queryEdges row for row (exact
// ids, prefixes, lists of up to 32 ids, exact text, one row per occurrence, self-links, links to
// missing documents and links in code kept, code point order), a malformed selector is USAGE and
// an answer above limits.edges is TOO_LARGE, never cut. packages/view-runtime/test/fixtures/view-conformance-expected.json
// lists the expected status of every row and the bundle the rows need.
// Statuses: answered (a result reply), refused (an error reply, code named in the summary),
// sent (no reply expected and none arrived), skipped (a precondition was missing), failed
// (a wrong shape, a wrong code, or no reply within the window). Other hosts byte-copy this
// entry and record the revision from <meta name="superbee-conformance-revision">.
(function conformance() {
  var REVISION = "7";
  var REPLY_WINDOW_MS = 5000;
  var NAVIGATION_WINDOW_MS = 1500;
  var UNDECLARED_CAPABILITY = "conformance.undeclared";
  var MISSING_TARGET = "views-registry/conformance-missing-target";
  var MISSING_DOCUMENT = "docs/conformance-missing-document";
  var MISSING_TYPE = "conformance-missing-type";
  var rows = [];
  var finished;
  var done = new Promise(function (resolve) { finished = resolve; });
  window.__conformance = { revision: REVISION, rows: rows, done: done };
  document.getElementById("revision").textContent = REVISION;

  function setText(id, text) { document.getElementById(id).textContent = text; }
  function record(request, status, summary) {
    rows.push({ request: request, status: status, summary: summary });
    var tr = document.createElement("tr");
    tr.setAttribute("data-request", request);
    tr.setAttribute("data-status", status);
    var cells = [["request", request], ["status", status], ["summary", summary]];
    for (var i = 0; i < cells.length; i++) {
      var td = document.createElement("td");
      td.setAttribute("class", cells[i][0]);
      td.textContent = cells[i][1];
      tr.appendChild(td);
    }
    document.getElementById("rows").appendChild(tr);
  }
  function within(promise, ms) {
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(new Error("no reply within " + ms + " ms")); }, ms);
      promise.then(function (value) { clearTimeout(timer); resolve(value); }, function (err) { clearTimeout(timer); reject(err); });
    });
  }
  function describe(err) { return (err && err.code ? err.code + ": " : "") + ((err && err.message) || String(err)); }
  function refusal(request, err) {
    record(request, err && err.code ? "refused" : "failed", describe(err));
  }
  // A one-shot raw exchange for the two requests the client does not correlate itself.
  function rawExchange(message, matches, ms) {
    return new Promise(function (resolve) {
      var timer = setTimeout(function () { window.removeEventListener("message", listener); resolve(null); }, ms);
      function listener(e) {
        if (e.source !== window.parent) return;
        var m = e.data;
        if (!m || !matches(m)) return;
        clearTimeout(timer);
        window.removeEventListener("message", listener);
        resolve(m);
      }
      window.addEventListener("message", listener);
      parent.postMessage(message, "*");
    });
  }
  function has(list, name) {
    for (var i = 0; i < list.length; i++) if (list[i] === name) return true;
    return false;
  }
  // A row whose only correct outcome is an error reply carrying `code`.
  function expectRefusal(request, promise, code, why) {
    return within(promise, REPLY_WINDOW_MS).then(function () {
      record(request, "failed", "answered; expected " + code + " " + why);
    }, function (err) {
      var expected = err && err.code === code;
      record(request, expected ? "refused" : "failed", describe(err) + (expected ? " " + why + " (expected)" : "; expected " + code + " " + why));
    });
  }

  var capabilities = [];
  var described = false;
  var queryLimit = null;
  var firstDoc = null;
  var firstType = null;
  var version = null;
  var edgeLimit = null;
  var changes = 0;

  function stepHello() {
    return within(Bridge.hello(), REPLY_WINDOW_MS).then(function (h) {
      var host = h && h.host;
      if (!host || typeof host.kind !== "string" || !host.capabilities || !host.limits) {
        record("hello", "failed", "reply carries no host descriptor");
        return;
      }
      capabilities = host.capabilities;
      described = true;
      queryLimit = host.limits.query;
      edgeLimit = host.limits.edges;
      setText("host", "host: " + host.kind + " (" + h.mode + ")");
      record("hello", "answered", "kind=" + host.kind + " grant=" + h.grant + " limits.query=" + host.limits.query +
        " capabilities=" + capabilities.join(","));
    }, function (err) { refusal("hello", err); });
  }
  function stepQuery() {
    return within(Bridge.query({ limit: 5 }), REPLY_WINDOW_MS).then(function (q) {
      if (!q || !q.rows) { record("query", "failed", "reply carries no rows"); return; }
      firstDoc = q.rows.length ? q.rows[0].id : null;
      var type = q.rows.length && q.rows[0].frontmatter ? q.rows[0].frontmatter.type : null;
      firstType = typeof type === "string" && type !== "" && type === type.trim() && type.indexOf(",") < 0 ? type : null;
      record("query", "answered", "rows=" + q.rows.length + " count=" + q.count);
    }, function (err) { refusal("query", err); });
  }
  function stepQueryNewest() {
    if (!has(capabilities, "query.newest")) {
      record("query-newest", "skipped", "query.newest not declared");
      return Promise.resolve();
    }
    return within(Bridge.query({ order: "newest", limit: 5 }), REPLY_WINDOW_MS).then(function (q) {
      if (!q || !q.rows || typeof q.count !== "number") { record("query-newest", "failed", "reply carries no rows or count"); return; }
      record("query-newest", "answered", "rows=" + q.rows.length + " count=" + q.count + " first=" + (q.rows.length ? q.rows[0].id : "none"));
    }, function (err) { refusal("query-newest", err); });
  }
  function stepRead() {
    if (!firstDoc) { record("read", "skipped", "no document to read"); return Promise.resolve(); }
    return within(Bridge.read(firstDoc), REPLY_WINDOW_MS).then(function (d) {
      record("read", d && d.id === firstDoc ? "answered" : "failed", "id=" + (d && d.id) + " body=" + ((d && d.body) || "").length + " chars");
    }, function (err) { refusal("read", err); });
  }
  function stepReadVersioned() {
    if (!firstDoc) { record("read-versioned", "skipped", "no document to read"); return Promise.resolve(); }
    return within(Bridge.readVersioned(firstDoc), REPLY_WINDOW_MS).then(function (r) {
      version = r && r.version;
      var ok = r && r.doc && r.doc.id === firstDoc && typeof version === "string";
      record("read-versioned", ok ? "answered" : "failed", "id=" + (r && r.doc && r.doc.id) + " version=" + version);
    }, function (err) { refusal("read-versioned", err); });
  }
  function stepEdges() {
    var params = firstDoc ? { from: firstDoc } : {};
    return within(Bridge.edges(params), REPLY_WINDOW_MS).then(function (e) {
      record("edges", e && e.edges ? "answered" : "failed", "from=" + (firstDoc || "*") + " count=" + (e && e.count));
    }, function (err) { refusal("edges", err); });
  }
  function stepGraph() {
    return within(Bridge.graph(), REPLY_WINDOW_MS).then(function (g) {
      var ok = g && g.documents && g.relationships && g.counts && typeof g.okfVersion === "string";
      var bodies = 0;
      if (ok) for (var i = 0; i < g.documents.length; i++) if (Object.prototype.hasOwnProperty.call(g.documents[i], "body")) bodies += 1;
      record("graph", ok && bodies === 0 ? "answered" : "failed", ok
        ? "okfVersion=" + g.okfVersion + " documents=" + g.counts.documents + " relationships=" + g.counts.relationships +
          " model=" + (Object.prototype.hasOwnProperty.call(g, "model") ? "present" : "absent") + " bodies=" + bodies
        : "reply carries no documents, relationships or counts");
    }, function (err) {
      var expected = err && err.code === "FORBIDDEN" && !has(capabilities, "graph");
      record("graph", err && err.code ? "refused" : "failed", describe(err) + (expected ? " (not declared, expected)" : ""));
    });
  }
  function stepRender() {
    if (!firstDoc) { record("render-document", "skipped", "no document to render"); return Promise.resolve(); }
    return within(Bridge.renderDocument(firstDoc), REPLY_WINDOW_MS).then(function (r) {
      var ok = r && r.document && r.document.id === firstDoc && typeof r.html === "string";
      record("render-document", ok ? "answered" : "failed", "version=" + (r && r.document && r.document.version) +
        " html=" + ((r && r.html) || "").length + " chars bounded=" + (r && r.bounded));
    }, function (err) { refusal("render-document", err); });
  }
  function stepSubscribe() {
    return within(Bridge.subscribe(function () { changes += 1; }), REPLY_WINDOW_MS).then(function (s) {
      record("subscribe", s && s.ok === true ? "answered" : "failed",
        "acknowledged; deltas=" + (has(capabilities, "subscribe-deltas") ? "declared" : "refresh-only"));
    }, function (err) { refusal("subscribe", err); });
  }
  function stepHost() {
    if (has(capabilities, UNDECLARED_CAPABILITY)) {
      record("host", "failed", UNDECLARED_CAPABILITY + " must never be declared");
      return Promise.resolve();
    }
    return within(Bridge.host(UNDECLARED_CAPABILITY, {}), REPLY_WINDOW_MS).then(function () {
      record("host", "failed", "an undeclared capability was answered");
    }, function (err) {
      var expected = err && err.code === "FORBIDDEN";
      record("host", expected ? "refused" : "failed", describe(err) + (expected ? " for undeclared capability (expected)" : ""));
    });
  }
  function stepPropose() {
    var requestId = "conformance-propose";
    var message = {
      bridge: "v1",
      type: "action.propose",
      requestId: requestId,
      action: {
        kind: "document.set-field",
        docId: firstDoc || "docs/conformance-missing",
        field: "conformance_probe",
        value: "probe",
        expectedVersion: version || "sha256:unknown"
      }
    };
    return rawExchange(message, function (m) {
      return m.bridge === "v1" && ((m.type === "action.result" && m.requestId === requestId) || (m.type === "error" && m.id === requestId));
    }, REPLY_WINDOW_MS).then(function (m) {
      if (!m) { record("action.propose", "failed", "no reply within " + REPLY_WINDOW_MS + " ms"); return; }
      if (m.type === "error") {
        record("action.propose", "refused", (m.error && m.error.code) + ": " + (m.error && m.error.message));
        return;
      }
      var status = m.result && m.result.status;
      var refused = status === "rejected" || status === "revoked" || status === "failed" || status === "expired";
      record("action.propose", refused ? "refused" : "answered", "status=" + status + (m.result && m.result.message ? ": " + m.result.message : ""));
    });
  }
  function stepBurst() {
    if (!firstDoc) { record("burst", "skipped", "no document to read"); return Promise.resolve(); }
    var reads = [];
    for (var i = 0; i < 12; i++) reads.push(Bridge.read(firstDoc));
    return within(Promise.all(reads), REPLY_WINDOW_MS).then(function (rs) {
      var matched = rs.filter(function (r) { return r && r.id === firstDoc; }).length;
      record("burst", rs.length === 12 && matched === 12 ? "answered" : "failed", rs.length + " results, " + matched + " of " + firstDoc);
    }, function (err) { refusal("burst", err); });
  }
  function stepOpenPage() {
    var id = "conformance-open";
    return rawExchange({ bridge: "v0", type: "open-page", id: id, pageId: MISSING_TARGET }, function (m) {
      return m.bridge === "v0" && m.id === id;
    }, NAVIGATION_WINDOW_MS).then(function (m) {
      if (!m) { record("open-page", "sent", "no reply within " + NAVIGATION_WINDOW_MS + " ms (fire-and-forget)"); return; }
      if (m.type === "error") { record("open-page", "refused", (m.error && m.error.code) + " for " + MISSING_TARGET); return; }
      record("open-page", "failed", "unexpected reply type " + m.type);
    });
  }

  function skipWithoutHello(request) {
    if (described) return false;
    record(request, "skipped", "hello carried no host descriptor");
    return true;
  }
  function stepRelationships() {
    if (skipWithoutHello("relationships")) return Promise.resolve();
    if (!firstDoc) { record("relationships", "skipped", "no document to read"); return Promise.resolve(); }
    var declared = has(capabilities, "relationships");
    var id = "conformance-relationships";
    return rawExchange({ bridge: "v0", type: "relationships", id: id, docId: firstDoc }, function (m) {
      return m.bridge === "v0" && m.id === id;
    }, REPLY_WINDOW_MS).then(function (m) {
      if (!m) { record("relationships", "failed", "no reply within " + REPLY_WINDOW_MS + " ms"); return; }
      if (m.type === "error") {
        var code = m.error && m.error.code;
        var expected = !declared && code === "FORBIDDEN";
        record("relationships", expected ? "refused" : "failed", code + ": " + (m.error && m.error.message) +
          (expected ? " (not declared, expected)" : declared ? "; declared but refused" : "; expected FORBIDDEN (not declared)"));
        return;
      }
      var r = m.type === "relationships:result" ? m.result : null;
      var shaped = r && r.documentId === firstDoc && r.rows && typeof r.rows.length === "number" && r.rows.length <= 30;
      record("relationships", declared && shaped ? "answered" : "failed", (declared ? "" : "answered although not declared; ") +
        "documentId=" + (r && r.documentId) + " rows=" + (r && r.rows ? r.rows.length : "none") + " cursor=" + (r && r.cursor ? "present" : "absent"));
    });
  }
  function stepQueryOverLimit() {
    if (skipWithoutHello("query-over-limit")) return Promise.resolve();
    if (typeof queryLimit !== "number" || !(queryLimit > 0)) {
      record("query-over-limit", "skipped", "limits.query is not a positive number");
      return Promise.resolve();
    }
    var limit = queryLimit + 1;
    return expectRefusal("query-over-limit", Bridge.query({ limit: limit }), "USAGE", "for limit=" + limit + " above limits.query=" + queryLimit);
  }
  // The matching total of a whole reply. The mirror bundle holds at most limits.query documents,
  // so a reply with limit 0 is never capped and its rows are the total on a host without query.count.
  function total(q) {
    return has(capabilities, "query.count") ? q.count : q.rows.length;
  }
  function shapedQuery(q) {
    return q && q.rows && typeof q.rows.length === "number" && typeof q.count === "number";
  }
  function stepQueryFieldOr() {
    if (skipWithoutHello("query-field-or")) return Promise.resolve();
    if (!firstType) { record("query-field-or", "skipped", "no typed document to filter on"); return Promise.resolve(); }
    // The missing type comes first, so a host that honors only the first value finds nothing; the
    // bundle holds a second type, so a host that drops the field returns rows of another type.
    var field = "type=" + MISSING_TYPE + "," + firstType;
    if (!has(capabilities, "query.field-or")) {
      return expectRefusal("query-field-or", Bridge.query({ field: field, limit: 1 }), "USAGE", "for a multi-value field (query.field-or not declared)");
    }
    return within(Promise.all([Bridge.query({ field: field, limit: 0 }), Bridge.query({ type: firstType, limit: 0 })]), REPLY_WINDOW_MS).then(function (rs) {
      var q = rs[0], byType = rs[1];
      if (!shapedQuery(q) || !shapedQuery(byType)) { record("query-field-or", "failed", "reply carries no rows or count"); return; }
      var others = q.rows.filter(function (row) { return !row.frontmatter || row.frontmatter.type !== firstType; }).length;
      var ok = q.rows.length > 0 && others === 0 && total(q) === total(byType);
      record("query-field-or", ok ? "answered" : "failed", "field=" + field + " matched=" + total(q) + " type=" + firstType +
        " matched=" + total(byType) + " other-type rows=" + others + (ok ? "" : "; expected exactly the rows of type " + firstType));
    }, function (err) { record("query-field-or", "failed", describe(err) + "; query.field-or is declared"); });
  }
  function stepQueryOpen() {
    if (skipWithoutHello("query-open")) return Promise.resolve();
    if (!has(capabilities, "query.open")) {
      return expectRefusal("query-open", Bridge.query({ open: true, limit: 1 }), "USAGE", "for open: true (query.open not declared)");
    }
    // The bundle holds one terminal document, so honoring open must match fewer rows.
    return within(Promise.all([Bridge.query({ open: true, limit: 0 }), Bridge.query({ limit: 0 })]), REPLY_WINDOW_MS).then(function (rs) {
      var q = rs[0], all = rs[1];
      if (!shapedQuery(q) || !shapedQuery(all)) { record("query-open", "failed", "reply carries no rows or count"); return; }
      var ok = total(q) < total(all);
      record("query-open", ok ? "answered" : "failed", "open matched=" + total(q) + " of " + total(all) +
        (ok ? "" : "; expected the terminal document to be dropped"));
    }, function (err) { record("query-open", "failed", describe(err) + "; query.open is declared"); });
  }
  function stepQueryMore() {
    if (skipWithoutHello("query-more")) return Promise.resolve();
    // The bundle holds at least two documents, so limit 1 always cuts the reply.
    return within(Bridge.query({ limit: 1 }), REPLY_WINDOW_MS).then(function (q) {
      if (!shapedQuery(q)) { record("query-more", "failed", "reply carries no rows or count"); return; }
      var counted = !has(capabilities, "query.count") || q.count > q.rows.length;
      var ok = q.rows.length === 1 && q.more === true && counted;
      record("query-more", ok ? "answered" : "failed", "rows=" + q.rows.length + " count=" + q.count + " more=" + (q.more === true) +
        (ok ? "" : "; expected one row and more: true from a capped reply"));
    }, function (err) { record("query-more", "failed", describe(err)); });
  }
  function stepReadMissing() {
    if (skipWithoutHello("read-missing")) return Promise.resolve();
    return expectRefusal("read-missing", Bridge.read(MISSING_DOCUMENT), "NOT_FOUND", "for " + MISSING_DOCUMENT);
  }
  function stepReadVersionedMissing() {
    if (skipWithoutHello("read-versioned-missing")) return Promise.resolve();
    return expectRefusal("read-versioned-missing", Bridge.readVersioned(MISSING_DOCUMENT), "NOT_FOUND", "for " + MISSING_DOCUMENT);
  }

  // The edges/ documents in the expected table's edgeDocuments, and the rows Core's queryEdges
  // answers over them, written from the definition. Order is from, then to, then text, each by
  // code point, so edges/U+E000 comes before the astral edges/U+1F41D (code units invert the two).
  var EDGE_A = "edges/a", EDGE_AB = "edges/ab", EDGE_B = "edges/b", EDGE_SUB = "edges/sub/c";
  var EDGE_MISSING = "edges/missing", EDGE_PRIVATE = "edges/", EDGE_ASTRAL = "edges/🐝";
  var EDGE_BULK_TEXT = "conformance-bulk", EDGE_BULK_ROWS = 1005, EDGE_SELECTOR_MAX = 32;
  var EDGES_OF_A = [
    [EDGE_A, EDGE_A, "self"],
    [EDGE_A, EDGE_B, "Beta"],
    [EDGE_A, EDGE_B, "beta"],
    [EDGE_A, EDGE_B, "beta"],
    [EDGE_A, EDGE_B, "code"],
    [EDGE_A, EDGE_MISSING, "missing"],
    [EDGE_A, EDGE_PRIVATE, "private use"],
    [EDGE_A, EDGE_ASTRAL, "astral"]
  ];
  function skipEdgeRow(request) {
    if (skipWithoutHello(request)) return true;
    if (has(capabilities, "edges")) return false;
    record(request, "skipped", "edges not declared");
    return true;
  }
  function edgeText(params) {
    var parts = [];
    for (var key in params) parts.push(key + "=" + (typeof params[key] === "string" ? params[key] : "[" + params[key].length + "]"));
    return parts.join(" ");
  }
  // Rows exactly { from, to, text } (strings, no other key) and count equal to the rows; null otherwise.
  function edgeRows(e) {
    if (!e || !e.edges || typeof e.edges.length !== "number" || e.count !== e.edges.length) return null;
    var out = [];
    for (var i = 0; i < e.edges.length; i++) {
      var row = e.edges[i];
      if (!row || typeof row !== "object" || Object.keys(row).length !== 3 || typeof row.from !== "string" || typeof row.to !== "string" || typeof row.text !== "string") return null;
      out.push([row.from, row.to, row.text]);
    }
    return out;
  }
  function expectEdges(request, params, expected) {
    if (skipEdgeRow(request)) return Promise.resolve();
    return within(Bridge.edges(params), REPLY_WINDOW_MS).then(function (e) {
      var got = edgeRows(e);
      if (!got) { record(request, "failed", edgeText(params) + " reply is not { edges: [{ from, to, text }], count } with count equal to the rows"); return; }
      var ok = JSON.stringify(got) === JSON.stringify(expected);
      record(request, ok ? "answered" : "failed", edgeText(params) + " rows=" + got.length +
        (ok ? "" : "; expected " + JSON.stringify(expected) + " got " + JSON.stringify(got.slice(0, 12))));
    }, function (err) { record(request, "failed", describe(err) + "; " + edgeText(params) + " expected " + expected.length + " rows"); });
  }
  function stepEdgesFrom() {
    // Two exact ids: edges/ab is not a row, since an id without a trailing slash is never a prefix.
    return expectEdges("edges-from", { from: [EDGE_A, EDGE_B] }, EDGES_OF_A.concat([[EDGE_B, EDGE_A, "alpha"]]));
  }
  function stepEdgesFromText() {
    return expectEdges("edges-from-text", { from: EDGE_A, text: "beta" }, [[EDGE_A, EDGE_B, "beta"], [EDGE_A, EDGE_B, "beta"]]);
  }
  function stepEdgesTo() {
    return expectEdges("edges-to", { to: EDGE_B }, [
      [EDGE_A, EDGE_B, "Beta"], [EDGE_A, EDGE_B, "beta"], [EDGE_A, EDGE_B, "beta"], [EDGE_A, EDGE_B, "code"],
      [EDGE_AB, EDGE_B, "beta"], [EDGE_SUB, EDGE_B, "beta"]
    ]);
  }
  function stepEdgesPrefixUnion() {
    return expectEdges("edges-prefix-union", { from: ["edges/sub/", EDGE_B] }, [[EDGE_B, EDGE_A, "alpha"], [EDGE_SUB, EDGE_B, "beta"]]);
  }
  function stepEdgesDangling() {
    return expectEdges("edges-dangling", { to: EDGE_MISSING }, [[EDGE_A, EDGE_MISSING, "missing"]]);
  }
  function stepEdgesFromListLimit() {
    var request = "edges-from-list-limit";
    if (skipEdgeRow(request)) return Promise.resolve();
    var ids = [EDGE_A];
    while (ids.length < EDGE_SELECTOR_MAX) ids.push("edges/none-" + ids.length);
    var over = ids.concat(["edges/none-" + ids.length]);
    return within(Bridge.edges({ from: ids }), REPLY_WINDOW_MS).then(function (e) {
      var got = edgeRows(e);
      if (!got || JSON.stringify(got) !== JSON.stringify(EDGES_OF_A)) {
        record(request, "failed", "from=[" + ids.length + "] rows=" + (got ? got.length : "malformed") + "; expected the " + EDGES_OF_A.length + " rows of " + EDGE_A);
        return;
      }
      return within(Bridge.edges({ from: over }), REPLY_WINDOW_MS).then(function () {
        record(request, "failed", "from=[" + over.length + "] answered; expected USAGE above " + EDGE_SELECTOR_MAX + " ids");
      }, function (err) {
        var ok = err && err.code === "USAGE";
        record(request, ok ? "answered" : "failed", "from=[" + ids.length + "] rows=" + got.length + "; from=[" + over.length + "] " + describe(err) +
          (ok ? "" : "; expected USAGE above " + EDGE_SELECTOR_MAX + " ids"));
      });
    }, function (err) { record(request, "failed", describe(err) + "; from=[" + ids.length + "] is within the limit"); });
  }
  function stepEdgesInvalidSelector() {
    if (skipEdgeRow("edges-invalid-selector")) return Promise.resolve();
    // Not a canonical id: refused, never resolved to edges/a and never a host failure.
    return expectRefusal("edges-invalid-selector", Bridge.edges({ from: "edges/../a" }), "USAGE", "for from=edges/../a");
  }
  function stepEdgesTooLarge() {
    var request = "edges-too-large";
    if (skipEdgeRow(request)) return Promise.resolve();
    if (typeof edgeLimit !== "number" || !(edgeLimit >= 0) || edgeLimit >= EDGE_BULK_ROWS) {
      record(request, "failed", "limits.edges=" + edgeLimit + "; the bundle's " + EDGE_BULK_ROWS + " " + EDGE_BULK_TEXT + " links must exceed it");
      return Promise.resolve();
    }
    return expectRefusal(request, Bridge.edges({ text: EDGE_BULK_TEXT }), "TOO_LARGE",
      "for " + EDGE_BULK_ROWS + " rows above limits.edges=" + edgeLimit);
  }

  // Order matters: open-page is last because some hosts retire the source launch on it. The
  // revision 5, 6 and 7 rows follow burst so the earlier rows keep their order.
  stepHello()
    .then(stepQuery).then(stepQueryNewest).then(stepRead).then(stepReadVersioned).then(stepEdges).then(stepGraph).then(stepRender)
    .then(stepSubscribe).then(stepHost).then(stepPropose).then(stepBurst)
    .then(stepRelationships).then(stepQueryOverLimit).then(stepQueryFieldOr).then(stepQueryOpen).then(stepQueryMore)
    .then(stepReadMissing).then(stepReadVersionedMissing)
    .then(stepEdgesFrom).then(stepEdgesFromText).then(stepEdgesTo).then(stepEdgesPrefixUnion).then(stepEdgesDangling)
    .then(stepEdgesFromListLimit).then(stepEdgesInvalidSelector).then(stepEdgesTooLarge).then(stepOpenPage)
    .then(function () {
      setText("status", "complete: " + rows.length + " rows, " + changes + " change events during the run");
      finished(rows);
    }, function (err) {
      setText("status", "aborted: " + describe(err));
      finished(rows);
    });
})();
</script>
</body>
</html>
